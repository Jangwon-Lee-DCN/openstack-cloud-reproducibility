openapi: 3.1.0
info:
  title: DCN Governance API
  version: 0.1.0
  description: Tenant-scoped development contract. Identity headers are injected by authenticated ingress.
servers:
  - url: https://p1-governance-services.dev.dcn.ssu.ac.kr
paths:
  /healthz:
    get:
      security: []
      responses: {"200": {description: healthy}}
  /v1/notifications:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/notifications/{id}: {$ref: "#/components/x-item"}
  /v1/events:
    get:
      security: [{keystoneToken: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [accepted]}}
      responses:
        "200": {description: project-scoped canonical event status page, content: {application/json: {schema: {$ref: "#/components/schemas/EventList"}}}}
    post:
      security: [{keystoneToken: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CanonicalEvent"}}}
      responses:
        "201": {description: event accepted transactionally, content: {application/json: {schema: {$ref: "#/components/schemas/EventStatus"}}}}
        "200": {description: byte-equivalent event or idempotency replay}
        "400": {description: schema, scope-independent, or bounds validation failure}
        "403": {description: Keystone scope or central OPA denial}
        "409": {description: event_id or Idempotency-Key content conflict}
        "413": {description: event exceeds 256 KiB}
  /v1/events/{event_id}:
    get:
      security: [{keystoneToken: []}]
      parameters:
        - {name: event_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: project-scoped ingestion status, content: {application/json: {schema: {$ref: "#/components/schemas/EventStatus"}}}}
        "404": {description: absent or not visible}
  /v1/subscriptions:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/subscriptions/{id}: {$ref: "#/components/x-item"}
  /v1/usage:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/usage/{id}: {$ref: "#/components/x-item"}
  /v1/usage-summary:
    get:
      security: [{keystoneToken: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}}
        - {name: meter, in: query, schema: {type: string}}
      responses:
        "200": {description: immutable project-scoped rated ledger, content: {application/json: {schema: {$ref: "#/components/schemas/UsageSummary"}}}}
        "403": {description: scope or central OPA denial}
  /v1/rate-cards:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/rate-cards/{id}: {$ref: "#/components/x-item"}
  /v1/budgets:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/budgets/{id}: {$ref: "#/components/x-item"}
  /v1/certificate-policies:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/certificate-policies/{id}: {$ref: "#/components/x-item"}
  /v1/rotation-policies:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/rotation-policies/{id}: {$ref: "#/components/x-item"}
  /v1/audit-events:
    get: {$ref: "#/components/x-list"}
  /v1/tag-policies:
    get: {$ref: "#/components/x-list"}
    post: {$ref: "#/components/x-create"}
  /v1/tag-policies/{id}: {$ref: "#/components/x-item"}
components:
  securitySchemes:
    keystoneToken:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 255}
  schemas:
    CanonicalEvent:
      type: object
      additionalProperties: false
      required: [contract_version, event_id, event_type, occurred_at, domain_id, project_id, actor_id, resource, severity, operation_id, correlation_id, request_id, payload]
      properties:
        contract_version: {const: track-b.event.v1alpha1}
        event_id: {type: string, format: uuid}
        event_type: {type: string, enum: [resource.changed, notification.delivery.succeeded, notification.delivery.failed, budget.threshold.crossed, certificate.renewal.succeeded, certificate.renewal.failed, credential.rotation.succeeded, credential.rotation.failed, audit.export.succeeded, audit.export.failed, tag.drift.detected, tag.drift.reconciled]}
        occurred_at: {type: string, format: date-time}
        domain_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        actor_id: {type: string, minLength: 1}
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties: {type: {type: string, minLength: 1}, id: {type: string, format: uuid}}
        severity: {type: string, enum: [INFO, WARNING, ERROR, CRITICAL]}
        operation_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
        request_id: {type: string, minLength: 1}
        payload: {type: object, additionalProperties: true}
    EventStatus:
      type: object
      additionalProperties: false
      required: [event_id, status, received_at, event]
      properties:
        event_id: {type: string, format: uuid}
        status: {type: string, enum: [accepted]}
        received_at: {type: string, format: date-time}
        event: {$ref: "#/components/schemas/CanonicalEvent"}
    EventList:
      type: object
      required: [items, next]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EventStatus"}}
        next: {type: [string, "null"]}
    UsageSummary:
      type: object
      additionalProperties: false
      required: [items, next, coverage, missing_meters, watermark, watermark_updated_at, currency, billing]
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        next: {type: [string, "null"]}
        coverage: {type: string, enum: [complete, incomplete]}
        missing_meters: {type: array, items: {type: string}}
        watermark: {type: [string, "null"]}
        watermark_updated_at: {type: [string, "null"], format: date-time}
        currency: {const: DCN-CREDIT}
        billing: {const: false}
    Resource:
      type: object
      required: [id, domain_id, project_id, operation_id, revision]
      properties:
        id: {type: string, format: uuid}
        domain_id: {type: string}
        project_id: {type: string}
        operation_id: {type: string}
        revision: {type: integer, minimum: 1}
      additionalProperties: true
    List:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Resource"}}
        next: {type: [string, "null"]}
  x-list:
    security: [{keystoneToken: []}]
    parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string}}
    responses:
      "200": {description: project-scoped list, content: {application/json: {schema: {$ref: "#/components/schemas/List"}}}}
      "403": {description: scope violation}
  x-create:
    security: [{keystoneToken: []}]
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
    requestBody:
      required: true
      content: {application/json: {schema: {type: object}}}
    responses:
      "201": {description: accepted desired state, content: {application/json: {schema: {$ref: "#/components/schemas/Resource"}}}}
      "400": {description: validation failure}
      "403": {description: scope or policy violation}
      "409": {description: revision conflict}
  x-item:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{keystoneToken: []}]
      responses: {"200": {description: resource}, "404": {description: not found}}
    patch:
      security: [{keystoneToken: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: If-Match, in: header, required: true, schema: {type: integer, minimum: 1}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: updated}, "409": {description: revision conflict}}
    delete:
      security: [{keystoneToken: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: If-Match, in: header, required: true, schema: {type: integer, minimum: 1}}
      responses: {"204": {description: deleted}, "409": {description: revision conflict}}
security: [{keystoneToken: []}]
