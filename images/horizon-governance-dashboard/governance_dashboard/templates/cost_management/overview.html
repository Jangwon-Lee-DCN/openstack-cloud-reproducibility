{% extends 'base.html' %}{% load i18n %}
{% block title %}{% trans "Cost Management" %}{% endblock %}
{% block main %}
<div class="page-header"><h1>{% trans "Cost Management" %}</h1></div>
{% for label, items in sections %}
<section class="panel panel-default"><div class="panel-heading"><h2 class="panel-title">{{ label }}</h2></div>
<div class="panel-body"><strong>{{ items|length }}</strong> {% trans "items" %}</div></section>
{% endfor %}
{% endblock %}
