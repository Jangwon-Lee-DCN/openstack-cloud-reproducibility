{{- $existing := lookup "v1" "Secret" .Release.Namespace "governance-postgresql" -}}
{{- $password := randAlphaNum 32 -}}
{{- if $existing }}{{- $password = index $existing.data "password" | b64dec -}}{{- end }}
apiVersion: v1
kind: Secret
metadata: {name: governance-postgresql}
type: Opaque
stringData: {password: {{ $password | quote }}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: governance-postgresql}
spec:
  serviceName: governance-postgresql
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: governance-postgresql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: governance-postgresql}}
    spec:
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector: {dcn.ssu.ac.kr/workload-class: development}
      tolerations:
        - {key: dcn.ssu.ac.kr/workload-class, operator: Equal, value: development, effect: NoSchedule}
        - {key: node-role.kubernetes.io/utility, operator: Equal, value: "true", effect: NoSchedule}
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          env:
            - {name: POSTGRESQL_DATABASE, value: governance}
            - {name: POSTGRESQL_USERNAME, value: governance}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: governance-postgresql, key: password}}
          ports: [{name: postgresql, containerPort: 5432}]
          readinessProbe: {tcpSocket: {port: postgresql}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /bitnami/postgresql}
            - {name: runtime, mountPath: /tmp, subPath: tmp}
            - {name: runtime, mountPath: /opt/bitnami/postgresql/conf, subPath: conf}
            - {name: runtime, mountPath: /opt/bitnami/postgresql/tmp, subPath: pg-tmp}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: runtime, emptyDir: {}}
        - {name: dshm, emptyDir: {medium: Memory}}
---
apiVersion: v1
kind: Service
metadata: {name: governance-postgresql}
spec:
  selector: {app.kubernetes.io/name: governance-postgresql}
  ports: [{name: postgresql, port: 5432}]
