apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: governance-api}
spec:
  parentRefs:
    - {name: {{ .Values.gateway.name }}, namespace: {{ .Values.gateway.namespace }}, sectionName: https}
  hostnames: [{{ .Values.host | quote }}]
  rules: [{backendRefs: [{name: governance-api, port: 80}]}]
