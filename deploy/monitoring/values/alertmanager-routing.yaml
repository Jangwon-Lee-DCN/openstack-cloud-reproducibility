alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace, project_namespace, severity]
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: delivery-test-audit
          matchers:
            - alertname = "AlertDeliveryE2EWarning"
          group_wait: 1s
          repeat_interval: 1h
        - receiver: critical-audit
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
        - receiver: warning-audit
          matchers:
            - severity = warning
          group_wait: 30s
          repeat_interval: 4h
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
        equal: [namespace, alertname]
      - source_matchers: [alertname = VPCElasticIPPoolQuotaExhausted]
        target_matchers: [alertname = VPCElasticIPPoolQuotaLow]
        equal: [project_namespace, pool]
      - source_matchers: [alertname = VPCControllerRolloutUnavailable]
        target_matchers:
          - alertname =~ VPCControllerReconcileErrors|VPCControllerReconcileLatencyHigh
    receivers:
      - name: "null"
      - name: critical-audit
        webhook_configs:
          - url: http://alertmanager-webhook-audit.monitoring.svc:8080/critical
            send_resolved: true
      - name: warning-audit
        webhook_configs:
          - url: http://alertmanager-webhook-audit.monitoring.svc:8080/warning
            send_resolved: true
      - name: delivery-test-audit
        webhook_configs:
          - url: http://alertmanager-webhook-audit.monitoring.svc:8080/test
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
