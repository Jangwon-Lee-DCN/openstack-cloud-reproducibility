images:
  tags:
    prometheus_openstack_exporter: ghcr.io/openstack-exporter/openstack-exporter:1.7.0
labels:
  # The chart does not expose Job tolerations; run the short-lived Keystone
  # bootstrap on any Linux node instead of the tainted control-plane nodes.
  job:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
pod:
  replicas:
    # The exporter authenticates once per OpenStack collector when its cache
    # expires. Multiple replicas synchronize those expensive password checks
    # and can starve interactive Keystone/Horizon requests.
    prometheus_openstack_exporter: 1
  affinity:
    anti:
      type:
        default: requiredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
conf:
  prometheus_openstack_exporter:
    OS_POLLING_INTERVAL: 300
    TIMEOUT_SECONDS: 30
    OS_RETRIES: 2
    # PoC public Gateway uses a cert-manager self-signed certificate.
    verify: false
    extra_args:
      # Services not installed or not registered in this PoC.
      - --disable-service.object-store
      - --disable-service.container-infra
      - --disable-service.dns
      - --disable-service.database
      # Unsupported/deprecated APIs and one operator-only Gnocchi endpoint.
      - --disable-metric=nova-security_groups
      - --disable-metric=nova-running_vms
      # Cinder enforces an internal administrator context after API policy.
      - --disable-metric=cinder-agent_state
      - --disable-metric=cinder-pool_capacity_free_gb
      - --disable-metric=gnocchi-status_metricd_processors
monitoring:
  prometheus:
    enabled: true
    openstack_exporter:
      scrape: true
manifests:
  certificates: false
  configmap_bin: true
  deployment: true
  job_image_repo_sync: false
  job_ks_user: true
  network_policy: false
  secret_keystone: true
  secret_registry: false
  service: true
endpoints:
  identity:
    auth:
      admin:
        region_name: seoul-ssu-1
        username: admin
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      user:
        # openstack-exporter 1.7.0 authenticates with a project-scoped token.
        # This dedicated role is granted only explicit read-only policy rules.
        role: monitoring
        region_name: seoul-ssu-1
        username: prometheus-openstack-exporter
        project_name: service
        user_domain_name: default
        project_domain_name: default
    hosts:
      default: keystone
      internal: keystone-api
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
