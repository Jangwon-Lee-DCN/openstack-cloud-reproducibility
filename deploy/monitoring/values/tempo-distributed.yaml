reportingEnabled: false

global:
  extraEnvFrom:
    - secretRef:
        name: tempo-traces
    - configMapRef:
        name: tempo-traces

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: ${BUCKET_NAME}
      endpoint: rook-ceph-rgw-openstack-object-store.rook-ceph.svc.cluster.local:80
      access_key: ${AWS_ACCESS_KEY_ID}
      secret_key: ${AWS_SECRET_ACCESS_KEY}
      insecure: true

ingester:
  replicas: 3
  extraArgs: [-config.expand-env=true]
  config:
    replication_factor: 2
  persistence:
    enabled: true
    storageClass: rook-ceph-block
    size: 10Gi
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

distributor:
  replicas: 2
  extraArgs: [-config.expand-env=true]
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

querier:
  replicas: 2
  extraArgs: [-config.expand-env=true]
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

queryFrontend:
  replicas: 2
  extraArgs: [-config.expand-env=true]
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

compactor:
  replicas: 1
  extraArgs: [-config.expand-env=true]
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

gateway:
  enabled: true
  replicas: 2
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

memcached:
  replicas: 2
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

metaMonitoring:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s

