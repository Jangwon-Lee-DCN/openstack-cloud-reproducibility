apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-envoy-openstack-gateway
  namespace: monitoring
  labels:
    observability.openstack.org/component: openstack-gateway
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  endpoints:
    - port: envoy-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: cilium-envoy
      metricRelabelings:
        # The Portal consumes only bounded Gateway/backend aggregates. Drop
        # request-path, downstream-connection and listener series here so
        # Envoy cannot turn user/request identity into Prometheus cardinality.
        - action: keep
          sourceLabels: [__name__]
          regex: envoy_cluster_upstream_rq_(total|xx|time_bucket|time_sum|time_count|timeout)
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openstack-rabbitmq
  namespace: monitoring
  labels:
    observability.openstack.org/component: rabbitmq
spec:
  namespaceSelector:
    matchNames: [openstack]
  selector:
    matchLabels:
      application: rabbitmq
      component: server
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
    # Keep the default low-cardinality broker endpoint above. Queue identity is
    # collected independently from RabbitMQ's bounded detailed endpoint; do
    # not switch /metrics to global per-object mode.
    - port: metrics
      path: /metrics/detailed
      interval: 60s
      scrapeTimeout: 20s
      params:
        family:
          - queue_coarse_metrics
          - queue_consumer_count
          - queue_delivery_metrics
          - queue_exchange_metrics
      relabelings:
        - action: replace
          targetLabel: job
          replacement: rabbitmq-queues
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openstack-exporter
  namespace: monitoring
  labels:
    observability.openstack.org/component: openstack
spec:
  namespaceSelector:
    matchNames: [openstack]
  selector:
    matchLabels:
      application: prometheus-openstack-exporter
      component: metrics
  endpoints:
    - port: http
      # A full exporter collection performs multiple OpenStack API lookups.
      # Five-minute inventory freshness is sufficient for capacity alerts and
      # prevents its Keystone authentication burst from delaying users.
      interval: 300s
      scrapeTimeout: 30s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpc-control-plane-prometheus-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpc-control-plane-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vpc-control-plane
  namespace: monitoring
  labels:
    observability.openstack.org/component: vpc-control-plane
spec:
  namespaceSelector:
    matchNames: [vpc-control-plane-system]
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vpc-control-plane
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vpc-facade
  namespace: monitoring
  labels:
    observability.openstack.org/component: vpc-control-plane
spec:
  namespaceSelector:
    matchNames: [vpc-control-plane-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: vpc-facade
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
