apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-synthetic-test
  namespace: openstack
data:
  run.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    name="monitoring-synthetic-$(date +%s)"
    network_id=""
    volume_id=""
    success=0
    identity_success=0
    network_success=0
    volume_success=0
    synthetic_site="${SYNTHETIC_SITE:-poc}"
    cleanup() {
      # Publish every completed stage before bounded cleanup. A slow backend
      # must not erase successful identity or network evidence.
      now="$(date +%s)"
      body="# TYPE openstack_synthetic_success gauge
    openstack_synthetic_success ${success}
    # TYPE openstack_synthetic_identity_success gauge
    openstack_synthetic_identity_success ${identity_success}
    # TYPE openstack_synthetic_network_success gauge
    openstack_synthetic_network_success ${network_success}
    # TYPE openstack_synthetic_volume_success gauge
    openstack_synthetic_volume_success ${volume_success}
    # TYPE openstack_synthetic_execution_interval_seconds gauge
    openstack_synthetic_execution_interval_seconds 900
    # TYPE openstack_synthetic_last_run_timestamp_seconds gauge
    openstack_synthetic_last_run_timestamp_seconds ${now}
    "
      curl --fail --silent --show-error --data-binary "${body}" \
        "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091/metrics/job/openstack-synthetic/site/${synthetic_site}"
      # A backend failure may create an error volume but return no ID to the
      # create command. Resolve the unique test name as a fallback and force
      # delete only resources owned by this run.
      for _ in 1 2 3; do
        while read -r stale_volume_id; do
          [[ -z "${stale_volume_id}" ]] || \
            timeout 30 openstack volume delete --force "${stale_volume_id}" >/dev/null 2>&1 || true
        done < <(timeout 30 openstack volume list --name "${name}" -f value -c ID 2>/dev/null || true)
        [[ -z "${volume_id}" ]] || timeout 30 openstack volume delete --force "${volume_id}" >/dev/null 2>&1 || true
        while read -r stale_network_id; do
          [[ -z "${stale_network_id}" ]] || \
            timeout 30 openstack network delete "${stale_network_id}" >/dev/null 2>&1 || true
        done < <(timeout 30 openstack network list --name "${name}" -f value -c ID 2>/dev/null || true)
        [[ -z "${network_id}" ]] || timeout 30 openstack network delete "${network_id}" >/dev/null 2>&1 || true
        sleep 2
      done
    }
    trap cleanup EXIT
    if timeout 120 openstack token issue >/dev/null; then
      identity_success=1
    else
      exit 1
    fi
    if network_id="$(timeout 120 openstack network create -f value -c id "${name}")"; then
      network_success=1
    fi
    if volume_id="$(timeout 120 openstack volume create --size 1 \
      --property dcn_synthetic_test=true -f value -c id "${name}")" && \
      timeout 120 openstack volume show "${volume_id}" >/dev/null; then
      volume_success=1
    fi
    if [[ ${identity_success} -eq 1 && ${network_success} -eq 1 && ${volume_success} -eq 1 ]]; then
      success=1
    fi
    [[ ${success} -eq 1 ]]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openstack-synthetic-test
  namespace: openstack
spec:
  schedule: "2,17,32,47 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            openstack-control-plane: enabled
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: test
              image: quay.io/airshipit/openstack-client:2025.1-ubuntu_noble
              command: ["/bin/bash", "/opt/synthetic/run.sh"]
              envFrom:
                - secretRef:
                    name: keystone-keystone-admin
              env:
                - {name: SYNTHETIC_SITE, value: poc}
              volumeMounts:
                - name: script
                  mountPath: /opt/synthetic
                  readOnly: true
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
          volumes:
            - name: script
              configMap:
                name: openstack-synthetic-test
                defaultMode: 0555
