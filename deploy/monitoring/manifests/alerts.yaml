apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openstack-platform
  namespace: monitoring
  labels:
    observability.openstack.org/component: openstack
spec:
  groups:
    - name: openstack.availability
      rules:
        - alert: OpenStackExporterDown
          expr: up{service="openstack-metrics"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: OpenStack exporter is unavailable
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackPublicAPIProbeFailed
          expr: probe_success{job="openstack-public-api"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: OpenStack public API probe failed
            description: "Target {{ $labels.instance }} has failed for five minutes."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackFloatingIPProbeFailed
          expr: probe_success{job="openstack-acceptance-floating-ip"} == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Acceptance-test floating IP is unreachable
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackRabbitMQMetricsDown
          expr: min(up{job="rabbitmq"}) == 0 or absent(rabbitmq_identity_info)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: RabbitMQ member metrics report down
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackMariaDBExporterDown
          expr: mysql_up == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: MariaDB exporter cannot query Galera
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackSyntheticTestFailed
          expr: max(openstack_synthetic_success) < 1
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: Scheduled OpenStack resource lifecycle test failed
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
        - alert: OpenStackSyntheticTestStale
          expr: time() - max(openstack_synthetic_last_run_timestamp_seconds) > 28800
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: No successful synthetic test report in eight hours
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#openstack-availability
    - name: platform.hardware
      rules:
        - alert: ControllerCPUTemperatureHigh
          expr: max by (instance) (node_hwmon_temp_celsius{chip="platform_coretemp_0"}) > 90
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Controller CPU temperature is high
            description: "CPU temperature on {{ $labels.instance }} has exceeded 90°C for five minutes."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#controller-temperature
        - alert: ControllerCPUTemperatureCritical
          expr: max by (instance) (node_hwmon_temp_celsius{chip="platform_coretemp_0"}) > 100
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Controller CPU temperature is near thermal shutdown
            description: "CPU temperature on {{ $labels.instance }} has exceeded 100°C. The hardware critical threshold is approximately 107°C."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#controller-temperature
    - name: vpc-control-plane.operations
      rules:
        - alert: VPCControllerReconcileErrors
          expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m])) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: VPC controller reconciliation is failing
            description: "Controller {{ $labels.controller }} has returned errors for ten minutes."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCControllerReconcileLatencyHigh
          expr: histogram_quantile(0.99, sum by (le, controller) (rate(vpc_reconcile_duration_seconds_bucket[10m]))) > 10
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: VPC controller reconciliation latency is high
            description: "Controller {{ $labels.controller }} p99 reconcile latency exceeds 10 seconds."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCSecurityGroupExternalPortViolation
          expr: increase(vpc_security_group_external_port_violations_total[10m]) > 0
          labels: {severity: warning}
          annotations:
            summary: VPC Security Group was found on an external port
            description: "Security Group {{ $labels.security_group }} in {{ $labels.project_namespace }} was detached from an out-of-VPC port."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCElasticIPAssociationFailures
          expr: increase(vpc_elastic_ip_association_failures_total[10m]) > 0
          labels: {severity: warning}
          annotations:
            summary: Elastic IP association failed
            description: "Elastic IP operations failed with reason {{ $labels.reason }} in {{ $labels.project_namespace }}."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCElasticIPPoolQuotaLow
          expr: vpc_elastic_ip_pool_quota_remaining < 3
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Elastic IP pool quota is nearly exhausted
            description: "Pool {{ $labels.pool }} in {{ $labels.project_namespace }} has only {{ $value }} project quota slots remaining."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCElasticIPPoolQuotaExhausted
          expr: vpc_elastic_ip_pool_quota_remaining == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Elastic IP pool quota is exhausted
            description: "Pool {{ $labels.pool }} in {{ $labels.project_namespace }} has no project floating-IP quota remaining."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCProjectCredentialBindingMissing
          expr: |
            kube_namespace_labels{namespace=~"vpc-[0-9a-f]{32}"}
              unless on(namespace)
            kube_secret_info{secret="openstack-credentials"}
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: VPC project credential binding is missing
            description: "Namespace {{ $labels.namespace }} has no openstack-credentials Secret."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCControllerRolloutUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="vpc-control-plane-system",deployment=~"vpc-control-plane-controller-manager|vpc-facade"} > 0
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: VPC control-plane rollout has unavailable replicas
            description: "Deployment {{ $labels.deployment }} has unavailable replicas for ten minutes."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNeutronConflictResponses
          expr: increase(vpc_neutron_conflicts_total[10m]) > 0
          labels: {severity: warning}
          annotations:
            summary: VPC controller received Neutron HTTP 409
            description: "{{ $labels.controller }} operation {{ $labels.operation }} received a conflict response."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNetworkInterfaceOperationStuck
          expr: vpc_network_interface_long_running == 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Network interface operation is stuck
            description: "Attachment {{ $labels.attachment }} in {{ $labels.project_namespace }} remains {{ $labels.state }}."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNetworkInterfaceAttachmentFailures
          expr: increase(vpc_network_interface_attachment_failures_total[10m]) > 0
          labels: {severity: warning}
          annotations:
            summary: Network interface attachment operation failed
            description: "Nova {{ $labels.operation }} failed with reason {{ $labels.reason }}."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNetworkInterfaceBindingSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(vpc_network_interface_binding_delay_seconds_bucket[15m]))) > 30
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Network interface binding is slow
            description: "The p95 Nova-to-Neutron binding latency exceeds 30 seconds."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNetworkInterfaceOrphanDetected
          expr: vpc_network_interface_orphans > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Orphan network interface resource detected
            description: "{{ $labels.project_namespace }} has {{ $value }} orphan {{ $labels.kind }} resources."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/alert-delivery.md#vpc-control-plane
        - alert: VPCNetworkInterfacePortQuotaLow
          expr: (vpc_network_interface_port_quota{kind="limit"} - on(project_namespace) vpc_network_interface_port_quota{kind="used"}) <= 10
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Network interface Port quota is nearly exhausted
            description: "{{ $labels.project_namespace }} has only {{ $value }} Neutron Port slots remaining."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/eni-operations.md
        - alert: VPCNetworkInterfacePortQuotaExhausted
          expr: (vpc_network_interface_port_quota{kind="limit"} - on(project_namespace) vpc_network_interface_port_quota{kind="used"}) <= 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Network interface Port quota is exhausted
            description: "{{ $labels.project_namespace }} cannot allocate another managed ENI Port."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/eni-operations.md
        - alert: VPCNeutronDriftPersistent
          expr: sum by (project_namespace) (vpc_neutron_drift_resources) > 0
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: VPC CRM and Neutron state have persistent drift
            description: "{{ $labels.project_namespace }} has reported drift for more than 30 minutes. Audit is read-only; review before requesting reconcile."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/neutron-drift-audit.md
        - alert: VPCNeutronDriftAuditStale
          expr: time() - vpc_neutron_drift_last_success_timestamp_seconds > 3600
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: VPC Neutron drift audit is stale
            description: "No successful drift report for {{ $labels.project_namespace }} in more than one hour."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/neutron-drift-audit.md
    - name: octavia.state-audit
      rules:
        - alert: OctaviaLoadBalancerLongPending
          expr: octavia_state_audit_issues{type="long_pending"} > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Octavia load balancer is stuck in PENDING state
            description: "{{ $value }} load balancer(s) have exceeded the configured PENDING_CREATE/UPDATE/DELETE threshold."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/octavia-state-audit.md
        - alert: OctaviaCrossRouterOwnershipOrphaned
          expr: octavia_state_audit_issues{type="orphaned_cross_router_ownership"} > 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: OVN cross-router state refers to a missing Octavia load balancer
            description: "{{ $value }} managed policy or route row(s) have ownership whose load balancer no longer exists."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/octavia-state-audit.md
        - alert: OctaviaOVNLoadBalancerRowDangling
          expr: octavia_state_audit_issues{type="dangling_ovn_load_balancer_rows"} > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: OVN Load_Balancer row has no matching Octavia load balancer
            description: "{{ $value }} UUID-named OVN Load_Balancer row(s) have no matching OVN-provider Octavia object."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/octavia-state-audit.md
        - alert: OctaviaCrossRouterNexthopInvalid
          expr: octavia_state_audit_issues{type="invalid_nexthops"} > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Managed OVN cross-router policy or route has no nexthop
            description: "{{ $value }} Octavia-owned OVN row(s) have empty policy nexthops or route nexthop."
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/octavia-state-audit.md
        - alert: OctaviaStateAuditStale
          expr: absent(octavia_state_audit_last_success_timestamp_seconds) or time() - octavia_state_audit_last_success_timestamp_seconds > 1800
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Octavia state audit result is missing or stale
            description: The read-only Octavia/OVN state audit has not published successfully in 30 minutes.
            runbook_url: https://github.com/Jangwon-Lee-DCN/openstack-cloud-reproducibility/blob/main/deploy/monitoring/docs/octavia-state-audit.md
