apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-placement-evidence
  namespace: openstack
  annotations:
    dcn.ssu.ac.kr/lifecycle: development-only
data:
  run.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    site="${PLACEMENT_EVIDENCE_SITE:-poc}"
    workdir="$(mktemp -d)"
    trap 'rm -rf "${workdir}"' EXIT

    timeout 60 openstack resource provider list -f json >"${workdir}/providers.json"
    while IFS=$'\t' read -r uuid name; do
      if ! timeout 60 openstack resource provider inventory list "${uuid}" -f json \
        >"${workdir}/inventory-${uuid}.json"; then
        printf '[]\n' >"${workdir}/inventory-${uuid}.json"
        : >"${workdir}/inventory-${uuid}.failed"
      fi
      if ! timeout 60 openstack resource provider trait list "${uuid}" -f json \
        >"${workdir}/traits-${uuid}.json"; then
        printf '[]\n' >"${workdir}/traits-${uuid}.json"
        : >"${workdir}/traits-${uuid}.failed"
      fi
    done < <(python3 - "${workdir}/providers.json" <<'PY'
    import json
    import sys

    for provider in json.load(open(sys.argv[1], encoding="utf-8")):
        print(f"{provider['uuid']}\t{provider['name']}")
    PY
    )

    python3 - "${workdir}" >"${workdir}/metrics" <<'PY'
    import json
    import pathlib
    import sys
    import time

    root = pathlib.Path(sys.argv[1])

    def load(name):
        return json.loads((root / name).read_text(encoding="utf-8"))

    def label(value):
        return str(value if value is not None else "").replace("\\", "\\\\").replace("\n", "\\n").replace('"', '\\"')

    def labels(values):
        return ",".join(f'{key}="{label(value)}"' for key, value in values.items())

    providers = load("providers.json")
    names = {provider["uuid"]: provider["name"] for provider in providers}
    print("# TYPE openstack_placement_provider_info gauge")
    print("# TYPE openstack_placement_provider_inventory_collected gauge")
    print("# TYPE openstack_placement_provider_trait_collection gauge")
    print("# TYPE openstack_placement_provider_inventory_total gauge")
    print("# TYPE openstack_placement_provider_inventory_used gauge")
    print("# TYPE openstack_placement_provider_inventory_reserved gauge")
    print("# TYPE openstack_placement_provider_inventory_allocation_ratio gauge")
    print("# TYPE openstack_placement_provider_trait gauge")
    print("# TYPE openstack_placement_evidence_last_run_timestamp_seconds gauge")
    for provider in providers:
        uuid = provider["uuid"]
        name = provider["name"]
        base = {
            "uuid": uuid,
            "name": name,
            "root_name": names.get(provider.get("root_provider_uuid"), provider.get("root_provider_uuid") or name),
            "parent_name": names.get(provider.get("parent_provider_uuid"), provider.get("parent_provider_uuid") or "none"),
        }
        print(f"openstack_placement_provider_info{{{labels(base)}}} 1")
        inventory_ok = not (root / f"inventory-{uuid}.failed").exists()
        traits_ok = not (root / f"traits-{uuid}.failed").exists()
        identity = labels({"uuid": uuid, "name": name})
        print(f"openstack_placement_provider_inventory_collected{{{identity}}} {1 if inventory_ok else 0}")
        print(f"openstack_placement_provider_trait_collection{{{identity}}} {1 if traits_ok else 0}")
        for item in load(f"inventory-{uuid}.json"):
            resource_class = item["resource_class"]
            item_labels = labels({"uuid": uuid, "name": name, "resource_class": resource_class})
            for field in ("total", "used", "reserved", "allocation_ratio"):
                print(f"openstack_placement_provider_inventory_{field}{{{item_labels}}} {item[field]}")
        for item in load(f"traits-{uuid}.json"):
            trait = item.get("name") or item.get("Name")
            if trait:
                print(f'openstack_placement_provider_trait{{{labels({"uuid": uuid, "name": name, "trait": trait})}}} 1')
    print(f"openstack_placement_evidence_last_run_timestamp_seconds {int(time.time())}")
    PY

    curl --fail --silent --show-error --max-time 30 --data-binary @"${workdir}/metrics" \
      "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091/metrics/job/openstack-placement-evidence/site/${site}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openstack-placement-evidence
  namespace: openstack
  annotations:
    dcn.ssu.ac.kr/lifecycle: development-only
spec:
  schedule: "11,26,41,56 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app.kubernetes.io/name: openstack-placement-evidence}
        spec:
          restartPolicy: Never
          nodeSelector: {openstack-control-plane: enabled}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: collector
              image: quay.io/airshipit/openstack-client@sha256:0bc46619c695868ca69657dcb1838e99694a7488ad89c23611cc4ffe49e64ca2
              command: [/bin/bash, /opt/placement-evidence/run.sh]
              workingDir: /tmp
              envFrom: [{secretRef: {name: keystone-keystone-admin}}]
              env: [{name: PLACEMENT_EVIDENCE_SITE, value: poc}, {name: HOME, value: /tmp}]
              volumeMounts: [{name: script, mountPath: /opt/placement-evidence, readOnly: true}, {name: tmp, mountPath: /tmp}]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
          volumes: [{name: script, configMap: {name: openstack-placement-evidence, defaultMode: 365}}, {name: tmp, emptyDir: {}}]
