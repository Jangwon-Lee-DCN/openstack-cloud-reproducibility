apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertmanager-operations
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  alertmanager-operations.json: |
    {"title":"VPC Alertmanager Operations","uid":"vpc-alertmanager-ops","schemaVersion":39,"refresh":"30s","tags":["vpc","alertmanager"],"links":[{"title":"Open Alertmanager (silence expiration/details)","url":"/alertmanager/","type":"link"}],"templating":{"list":[{"name":"severity","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(ALERTS, severity)"},"includeAll":true,"allValue":".*"},{"name":"project","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(ALERTS, project_namespace)"},"includeAll":true,"allValue":".*"},{"name":"controller","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(ALERTS, controller)"},"includeAll":true,"allValue":".*"}]},"panels":[{"id":1,"type":"stat","title":"Firing","gridPos":{"x":0,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",severity=~\"$severity\",project_namespace=~\"$project\",controller=~\"$controller\"}) or vector(0)"}]},{"id":2,"type":"stat","title":"Pending","gridPos":{"x":6,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"pending\",severity=~\"$severity\",project_namespace=~\"$project\",controller=~\"$controller\"}) or vector(0)"}]},{"id":3,"type":"stat","title":"Active silences","description":"Use the Alertmanager link for individual expiration times.","gridPos":{"x":12,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(alertmanager_silences{state=\"active\"}) or vector(0)"}]},{"id":4,"type":"stat","title":"Expired silences","gridPos":{"x":18,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(alertmanager_silences{state=\"expired\"}) or vector(0)"}]},{"id":5,"type":"timeseries","title":"Notification delivery / failure rate","gridPos":{"x":0,"y":5,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"legendFormat":"delivered {{integration}}","expr":"sum by (integration) (rate(alertmanager_notifications_total[5m]))"},{"legendFormat":"failed {{integration}}","expr":"sum by (integration) (rate(alertmanager_notifications_failed_total[5m]))"}]},{"id":6,"type":"table","title":"Current alerts","gridPos":{"x":12,"y":5,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"format":"table","instant":true,"expr":"ALERTS{alertstate=~\"firing|pending\",severity=~\"$severity\",project_namespace=~\"$project\",controller=~\"$controller\"}"}]},{"id":7,"type":"timeseries","title":"Credential expiry (days remaining)","gridPos":{"x":0,"y":13,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"legendFormat":"{{project_namespace}}","expr":"(vpc_project_credential_expiry_timestamp_seconds - time()) / 86400"}]},{"id":8,"type":"timeseries","title":"Credential rotations / mismatches","gridPos":{"x":12,"y":13,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"legendFormat":"rotation {{outcome}}/{{reason}}","expr":"sum by (outcome,reason) (rate(vpc_project_credential_rotations_total[15m]))"},{"legendFormat":"mismatch {{reason}}","expr":"sum by (reason) (rate(vpc_project_credential_binding_mismatches_total[15m]))"}]}],"time":{"from":"now-6h","to":"now"}}
