apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vpc-control-plane
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vpc-control-plane.json: |
    {
      "uid":"vpc-control-plane-operations",
      "title":"VPC Control Plane / Network Interfaces",
      "description":"Operational view of ENI attachment lifecycle, Nova and Neutron convergence, failures, conflicts and drift.",
      "tags":["openstack","vpc","eni","network"],
      "schemaVersion":39,
      "version":2,
      "refresh":"30s",
      "graphTooltip":1,
      "time":{"from":"now-6h","to":"now"},
      "links":[
        {"title":"Platform overview","url":"/grafana/d/openstack-platform-operations/openstack-platform-operations","type":"link"},
        {"title":"Neutron operations","url":"/grafana/d/openstack-neutron-operations/openstack-neutron-operations","type":"link"},
        {"title":"Alertmanager","url":"/alertmanager/","type":"link","targetBlank":true}
      ],
      "templating":{"list":[
        {"name":"project_namespace","label":"Project namespace","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(vpc_network_interface_info, project_namespace)","refId":"VariableQuery"},"includeAll":true,"allValue":".*","multi":true,"refresh":1,"current":{"text":"All","value":"$__all"}},
        {"name":"vpc","label":"VPC","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(vpc_network_interface_info{project_namespace=~\"$project_namespace\"}, vpc)","refId":"VariableQuery"},"includeAll":true,"allValue":".*","multi":true,"refresh":1,"current":{"text":"All","value":"$__all"}},
        {"name":"subnet","label":"Subnet","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(vpc_network_interface_info{project_namespace=~\"$project_namespace\",vpc=~\"$vpc\"}, subnet)","refId":"VariableQuery"},"includeAll":true,"allValue":".*","multi":true,"refresh":1,"current":{"text":"All","value":"$__all"}},
        {"name":"network_interface","label":"Network interface","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(vpc_network_interface_info{project_namespace=~\"$project_namespace\",vpc=~\"$vpc\",subnet=~\"$subnet\"}, network_interface)","refId":"VariableQuery"},"includeAll":true,"allValue":".*","multi":true,"refresh":1,"current":{"text":"All","value":"$__all"}},
        {"name":"request_id","label":"Request ID","type":"textbox","query":"","current":{"text":"","value":""}}
      ]},
      "annotations":{"list":[
        {"name":"ENI alerts","datasource":{"type":"prometheus","uid":"prometheus"},"enable":true,"expr":"ALERTS{alertstate=\"firing\",alertname=~\"VPCNetworkInterface.*\"}","iconColor":"red","tagKeys":"alertname,severity","titleFormat":"{{alertname}}"}
      ]},
      "panels":[
        {"id":1,"type":"row","title":"Current risk — start here","collapsed":false,"gridPos":{"x":0,"y":0,"w":24,"h":1},"panels":[]},
        {"id":2,"type":"stat","title":"Stuck operations","description":"Attachments in Attaching or Detaching for more than five minutes.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(vpc_network_interface_long_running{project_namespace=~\"$project_namespace\"}) or vector(0)","legendFormat":"stuck"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":0,"y":1,"w":6,"h":5}},
        {"id":3,"type":"stat","title":"Orphan resources","description":"Read-only inventory of managed-looking Neutron Ports and dangling Attachment CRs.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(vpc_network_interface_orphans{project_namespace=~\"$project_namespace\"}) or vector(0)","legendFormat":"orphans"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":6,"y":1,"w":6,"h":5}},
        {"id":4,"type":"stat","title":"Attach/detach failures (1h)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(vpc_network_interface_attachment_failures_total[1h])) or vector(0)","legendFormat":"failures"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":12,"y":1,"w":6,"h":5}},
        {"id":5,"type":"stat","title":"Neutron conflicts (1h)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(vpc_neutron_conflicts_total{controller=\"networkinterface\"}[1h])) or vector(0)","legendFormat":"HTTP 409"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":18,"y":1,"w":6,"h":5}},
        {"id":10,"type":"row","title":"Attachment lifecycle and convergence","collapsed":false,"gridPos":{"x":0,"y":6,"w":24,"h":1},"panels":[]},
        {"id":11,"type":"timeseries","title":"Nova attach/detach request latency","description":"Provider request duration split by operation and outcome.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.50, sum by (le,operation,outcome) (rate(vpc_network_interface_attachment_operation_seconds_bucket[10m])))","legendFormat":"p50 {{operation}} / {{outcome}}"},{"expr":"histogram_quantile(0.95, sum by (le,operation,outcome) (rate(vpc_network_interface_attachment_operation_seconds_bucket[10m])))","legendFormat":"p95 {{operation}} / {{outcome}}"}],"fieldConfig":{"defaults":{"unit":"s","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":7,"w":12,"h":9}},
        {"id":12,"type":"timeseries","title":"End-to-end binding delay","description":"Time from Attachment CR creation until Nova and Neutron both agree on the binding.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.50, sum by (le) (rate(vpc_network_interface_binding_delay_seconds_bucket[15m])))","legendFormat":"p50"},{"expr":"histogram_quantile(0.95, sum by (le) (rate(vpc_network_interface_binding_delay_seconds_bucket[15m])))","legendFormat":"p95"},{"expr":"histogram_quantile(0.99, sum by (le) (rate(vpc_network_interface_binding_delay_seconds_bucket[15m])))","legendFormat":"p99"}],"fieldConfig":{"defaults":{"unit":"s","min":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":15},{"color":"red","value":30}]}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":12,"y":7,"w":12,"h":9}},
        {"id":20,"type":"row","title":"Failure diagnosis and drift","collapsed":false,"gridPos":{"x":0,"y":16,"w":24,"h":1},"panels":[]},
        {"id":21,"type":"timeseries","title":"Failure reasons","description":"Click a series to open matching controller logs in Loki.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (operation,reason) (increase(vpc_network_interface_attachment_failures_total[15m])) or vector(0)","legendFormat":"{{operation}} / {{reason}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0,"links":[{"title":"Open matching logs","url":"/grafana/explore?left=%7B%22datasource%22:%22loki%22,%22queries%22:%5B%7B%22expr%22:%22%7Bnamespace%3D%5C%22vpc-control-plane-system%5C%22%7D%20%7C%3D%20%5C%22${__series.name}%5C%22%22%7D%5D%7D","targetBlank":true}]},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":17,"w":8,"h":9}},
        {"id":22,"type":"timeseries","title":"Neutron HTTP 409 by operation","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (operation) (increase(vpc_neutron_conflicts_total{controller=\"networkinterface\"}[15m])) or vector(0)","legendFormat":"{{operation}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":8,"y":17,"w":8,"h":9}},
        {"id":23,"type":"bargauge","title":"Orphans by project and kind","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max by (project_namespace,kind) (vpc_network_interface_orphans{project_namespace=~\"$project_namespace\"})","legendFormat":"{{project_namespace}} / {{kind}}","instant":true}],"fieldConfig":{"defaults":{"decimals":0,"min":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}},"overrides":[]},"options":{"displayMode":"gradient","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showUnfilled":true},"gridPos":{"x":16,"y":17,"w":8,"h":9}},
        {"id":30,"type":"table","title":"Active ENI alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"ALERTS{alertstate=\"firing\",alertname=~\"VPCNetworkInterface.*\"}","format":"table","instant":true}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":26,"w":24,"h":8}},
        {"id":40,"type":"row","title":"Reliability objective and correlation","collapsed":false,"gridPos":{"x":0,"y":34,"w":24,"h":1},"panels":[]},
        {"id":41,"type":"gauge","title":"Attachment success SLO (24h)","description":"Successful Nova operations divided by all completed attach/detach operations. Target: 99%.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"100 * sum(increase(vpc_network_interface_attachment_operation_seconds_count{outcome=\"success\"}[24h])) / clamp_min(sum(increase(vpc_network_interface_attachment_operation_seconds_count[24h])), 1)","legendFormat":"success"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":95},{"color":"green","value":99}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showThresholdLabels":false,"showThresholdMarkers":true},"gridPos":{"x":0,"y":35,"w":6,"h":8}},
        {"id":42,"type":"stat","title":"Current reported drift","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(vpc_network_interface_info{project_namespace=~\"$project_namespace\",vpc=~\"$vpc\",subnet=~\"$subnet\",network_interface=~\"$network_interface\",drift=\"true\"}) or vector(0)","legendFormat":"interfaces"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":6,"y":35,"w":6,"h":8}},
        {"id":43,"type":"logs","title":"VPC controller logs","description":"Filter by the chained project/VPC/Subnet/ENI variables; use a request ID to open its Tempo trace.","datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"vpc-control-plane-system\"} |~ \"$network_interface|$request_id\"","refId":"A"}],"fieldConfig":{"defaults":{"links":[{"title":"Open request trace in Tempo","url":"/grafana/explore?left=%7B%22datasource%22:%22tempo%22,%22queries%22:%5B%7B%22queryType%22:%22traceql%22,%22query%22:%22%7Bspan.%5C%22request.id%5C%22%3D%5C%22$request_id%5C%22%7D%22%7D%5D%7D","targetBlank":true}]},"overrides":[]},"options":{"dedupStrategy":"none","enableLogDetails":true,"prettifyLogMessage":false,"showCommonLabels":false,"showLabels":false,"showTime":true,"sortOrder":"Descending","wrapLogMessage":true},"gridPos":{"x":12,"y":35,"w":12,"h":8}},
        {"id":44,"type":"timeseries","title":"Automatic drift repairs","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (project_namespace,vpc,subnet) (increase(vpc_network_interface_drift_repairs_total{project_namespace=~\"$project_namespace\",vpc=~\"$vpc\",subnet=~\"$subnet\"}[1h]))","legendFormat":"{{project_namespace}} / {{vpc}} / {{subnet}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["sum"]}},"gridPos":{"x":0,"y":43,"w":12,"h":8}},
        {"id":45,"type":"timeseries","title":"Neutron Port quota capacity","description":"Used/reserved Ports and provider limit. Trend estimates when ENI capacity will be exhausted.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"vpc_network_interface_port_quota{project_namespace=~\"$project_namespace\"}","legendFormat":"{{project_namespace}} / {{kind}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":12,"y":43,"w":12,"h":8}}
      ]
    }
