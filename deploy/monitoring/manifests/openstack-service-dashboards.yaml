      {"id":3,"type":"stat","title":"Public Compute API","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"min(probe_success{job=\"openstack-public-api\",instance=~\".*/compute.*\"})","legendFormat":"reachability"},{"expr":"max(probe_duration_seconds{job=\"openstack-public-api\",instance=~\".*/compute.*\"})","legendFormat":"latency"}],"fieldConfig":{"defaults":{},"overrides":[{"matcher":{"id":"byName","options":"latency"},"properties":[{"id":"unit","value":"s"}]}]},"options":{"colorMode":"background","graphMode":"area","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":4,"y":1,"w":5,"h":5}},
      {"id":4,"type":"stat","title":"VM inventory","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_nova_total_vms)","legendFormat":"VMs"},{"expr":"max(openstack_nova_flavors)","legendFormat":"flavors"},{"expr":"max(openstack_nova_availability_zones)","legendFormat":"AZs"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":9,"y":1,"w":6,"h":5}},
      {"id":5,"type":"stat","title":"Compute service alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",alertname=~\".*(Nova|Compute|Placement|VM).*\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":15,"y":1,"w":4,"h":5}},
      {"id":6,"type":"bargauge","title":"Nova control-plane readiness","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max by (deployment) (kube_deployment_status_replicas_ready{namespace=\"openstack\",deployment=~\"nova-.*|placement-api\"}) / clamp_min(max by (deployment) (kube_deployment_status_replicas{namespace=\"openstack\",deployment=~\"nova-.*|placement-api\"}),1)","legendFormat":"{{deployment}}","instant":true}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"orientation":"horizontal","displayMode":"gradient","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":19,"y":1,"w":5,"h":8}},
      {"id":10,"type":"row","title":"VM state and compute capacity","gridPos":{"x":0,"y":9,"w":24,"h":1},"panels":[]},
      {"id":11,"type":"timeseries","title":"VM inventory trend","description":"Total VM count. Per-status detail is omitted because the deployed exporter currently publishes no server-status series.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_nova_total_vms)","legendFormat":"VMs"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true,"calcs":["lastNotNull","max"]}},"gridPos":{"x":0,"y":10,"w":14,"h":10}},
      {"id":12,"type":"stat","title":"Compute agent state","description":"Nova service/agent state exported per host and binary.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"openstack_nova_agent_state","legendFormat":"{{hostname}} / {{service}}"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red"},"1":{"text":"UP","color":"green"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":14,"y":10,"w":10,"h":10}},
      {"id":13,"type":"gauge","title":"Placement capacity utilization","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_placement_resource_usage{resourcetype=\"VCPU\"})/clamp_min(max(openstack_placement_resource_total{resourcetype=\"VCPU\"}),1)","legendFormat":"vCPU"},{"expr":"max(openstack_placement_resource_usage{resourcetype=\"MEMORY_MB\"})/clamp_min(max(openstack_placement_resource_total{resourcetype=\"MEMORY_MB\"}),1)","legendFormat":"memory"},{"expr":"max(openstack_placement_resource_usage{resourcetype=\"DISK_GB\"})/clamp_min(max(openstack_placement_resource_total{resourcetype=\"DISK_GB\"}),1)","legendFormat":"disk"}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.7},{"color":"red","value":0.9}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showThresholdMarkers":true},"gridPos":{"x":0,"y":20,"w":10,"h":9}},
      {"id":14,"type":"timeseries","title":"Nova control-plane CPU","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"topk(10,sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"openstack\",pod=~\"nova-.*|placement-.*\",container!=\"\",image!=\"\"}[5m])))","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"cores","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"right","calcs":["lastNotNull","max"]}},"gridPos":{"x":10,"y":20,"w":14,"h":9}}
    ]}
