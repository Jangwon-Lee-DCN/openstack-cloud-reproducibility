apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-database-messaging-operations, namespace: monitoring, labels: {grafana_dashboard: "1"}}
data:
  database-messaging-operations.json: |
    {"uid":"openstack-database-messaging-operations","title":"OpenStack / MariaDB & RabbitMQ Operations","description":"Shared control-plane dependencies: Galera health and latency, SQL pressure, RabbitMQ alarms, backlog, redelivery and resource saturation.","tags":["openstack","mariadb","rabbitmq"],"schemaVersion":39,"refresh":"30s","graphTooltip":1,"time":{"from":"now-6h","to":"now"},"links":[{"title":"Platform overview","url":"/grafana/d/openstack-platform-operations/openstack-platform-operations","type":"link"}],"panels":[
      {"id":1,"type":"row","title":"Cluster health and saturation","gridPos":{"x":0,"y":0,"w":24,"h":1},"panels":[]},
      {"id":2,"type":"stat","title":"MariaDB exporters","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(mysql_up)","legendFormat":"healthy"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":1},{"color":"green","value":2}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":0,"y":1,"w":4,"h":5}},
      {"id":3,"type":"stat","title":"RabbitMQ nodes","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"count(rabbitmq_identity_info)","legendFormat":"nodes"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":2},{"color":"green","value":3}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":4,"y":1,"w":4,"h":5}},
      {"id":4,"type":"stat","title":"RabbitMQ alarms","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rabbitmq_alarms_memory_used_watermark)","legendFormat":"memory"},{"expr":"sum(rabbitmq_alarms_free_disk_space_watermark)","legendFormat":"disk"},{"expr":"sum(rabbitmq_alarms_file_descriptor_limit)","legendFormat":"file descriptors"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":8,"y":1,"w":6,"h":5}},
      {"id":5,"type":"stat","title":"Queue backlog","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rabbitmq_queue_messages_ready)","legendFormat":"ready"},{"expr":"sum(rabbitmq_queue_messages_unacked)","legendFormat":"unacked"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":100},{"color":"red","value":1000}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":14,"y":1,"w":5,"h":5}},
      {"id":6,"type":"stat","title":"Dependency alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",alertname=~\".*(MariaDB|MySQL|RabbitMQ|Galera).*\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":19,"y":1,"w":5,"h":5}},
      {"id":10,"type":"row","title":"MariaDB / Galera","gridPos":{"x":0,"y":6,"w":24,"h":1},"panels":[]},
      {"id":11,"type":"timeseries","title":"SQL connections and running threads","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(mysql_global_status_threads_connected)","legendFormat":"connected"},{"expr":"max(mysql_global_status_threads_running)","legendFormat":"running"},{"expr":"sum(rate(mysql_global_status_connections[5m]))","legendFormat":"new connections/s"}],"fieldConfig":{"defaults":{"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":0,"y":7,"w":8,"h":9}},
      {"id":12,"type":"timeseries","title":"Galera replication latency","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(mysql_galera_evs_repl_latency_avg_seconds)","legendFormat":"average"},{"expr":"max(mysql_galera_evs_repl_latency_max_seconds)","legendFormat":"maximum"}],"fieldConfig":{"defaults":{"unit":"s","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":8,"y":7,"w":8,"h":9}},
      {"id":13,"type":"timeseries","title":"InnoDB contention and durability","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(mysql_global_status_innodb_deadlocks[5m]))","legendFormat":"deadlocks/s"},{"expr":"max(mysql_global_status_innodb_row_lock_current_waits)","legendFormat":"current lock waits"},{"expr":"max(mysql_global_status_innodb_data_pending_fsyncs)","legendFormat":"pending fsyncs"}],"fieldConfig":{"defaults":{"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":16,"y":7,"w":8,"h":9}},
      {"id":20,"type":"row","title":"RabbitMQ throughput and pressure","gridPos":{"x":0,"y":16,"w":24,"h":1},"panels":[]},
      {"id":21,"type":"timeseries","title":"Message throughput and redelivery","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(rabbitmq_global_messages_received_total[5m]))","legendFormat":"received/s"},{"expr":"sum(rate(rabbitmq_global_messages_delivered_total[5m]))","legendFormat":"delivered/s"},{"expr":"sum(rate(rabbitmq_global_messages_redelivered_total[5m]))","legendFormat":"redelivered/s"},{"expr":"sum(rate(rabbitmq_global_messages_unroutable_dropped_total[5m]))","legendFormat":"unroutable dropped/s"}],"fieldConfig":{"defaults":{"unit":"ops","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":0,"y":17,"w":8,"h":9}},
      {"id":22,"type":"timeseries","title":"Queue backlog trend","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rabbitmq_queue_messages_ready)","legendFormat":"ready"},{"expr":"sum(rabbitmq_queue_messages_unacked)","legendFormat":"unacked"},{"expr":"sum(rabbitmq_queue_messages_paged_out)","legendFormat":"paged out"}],"fieldConfig":{"defaults":{"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":8,"y":17,"w":8,"h":9}},
      {"id":23,"type":"timeseries","title":"RabbitMQ resource saturation","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(rabbitmq_process_open_fds/rabbitmq_process_max_fds)","legendFormat":"file descriptors"},{"expr":"max(rabbitmq_process_open_tcp_sockets/rabbitmq_process_max_tcp_sockets)","legendFormat":"TCP sockets"},{"expr":"max(rabbitmq_process_resident_memory_bytes/rabbitmq_resident_memory_limit_bytes)","legendFormat":"memory"},{"expr":"max(rabbitmq_erlang_processes_used/rabbitmq_erlang_processes_limit)","legendFormat":"Erlang processes"}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.7},{"color":"red","value":0.9}]}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":16,"y":17,"w":8,"h":9}}
    ]}
