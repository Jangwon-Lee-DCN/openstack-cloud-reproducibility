    {"uid":"openstack-keystone-operations","title":"OpenStack / Keystone Identity Operations","description":"Identity API reachability, control-plane readiness, identity inventory, resource use and credential-related alerts.","tags":["openstack","keystone","identity"],"schemaVersion":39,"refresh":"30s","time":{"from":"now-6h","to":"now"},"links":[{"title":"Platform overview","url":"/grafana/d/openstack-platform-operations/openstack-platform-operations","type":"link"}],"panels":[
