apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-neutron-operations, namespace: monitoring, labels: {grafana_dashboard: "1"}}
data:
  neutron-operations.json: |
    {"uid":"openstack-neutron-operations","title":"OpenStack / Neutron Network Operations","description":"Network incident workflow: API and control-plane health, resource anomalies, OVN readiness, inventory, drift and active alerts.","tags":["openstack","neutron","network"],"schemaVersion":39,"refresh":"30s","graphTooltip":1,"time":{"from":"now-6h","to":"now"},"links":[{"title":"Platform overview","url":"/grafana/d/openstack-platform-operations/openstack-platform-operations","type":"link"}],"panels":[
      {"id":1,"type":"row","title":"Incident and API health","gridPos":{"x":0,"y":0,"w":24,"h":1},"panels":[]},
      {"id":2,"type":"stat","title":"Neutron exporter check","description":"OpenStack exporter can authenticate and query Neutron.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"min(openstack_neutron_up)","legendFormat":"Neutron"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red"},"1":{"text":"UP","color":"green"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":0,"y":1,"w":4,"h":5}},
      {"id":3,"type":"stat","title":"Public Network API","description":"External blackbox reachability of the Neutron endpoint.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"min(probe_success{job=\"openstack-public-api\",instance=~\".*/network.*\"})","legendFormat":"reachability"},{"expr":"max(probe_duration_seconds{job=\"openstack-public-api\",instance=~\".*/network.*\"})","legendFormat":"latency"}],"fieldConfig":{"defaults":{},"overrides":[{"matcher":{"id":"byName","options":"latency"},"properties":[{"id":"unit","value":"s"}]}]},"options":{"colorMode":"background","graphMode":"area","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":4,"y":1,"w":5,"h":5}},
      {"id":4,"type":"stat","title":"Resource anomalies","description":"Routers, LB ports and associated floating IPs not ACTIVE.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_neutron_routers_not_active) or vector(0)","legendFormat":"routers"},{"expr":"max(openstack_neutron_ports_lb_not_active) or vector(0)","legendFormat":"LB ports"},{"expr":"max(openstack_neutron_floating_ips_associated_not_active) or vector(0)","legendFormat":"floating IPs"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":9,"y":1,"w":7,"h":5}},
      {"id":5,"type":"stat","title":"Neutron server readiness","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(kube_deployment_status_replicas_ready{namespace=\"openstack\",deployment=\"neutron-server\"}) / clamp_min(max(kube_deployment_status_replicas{namespace=\"openstack\",deployment=\"neutron-server\"}),1)","legendFormat":"ready"}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":16,"y":1,"w":4,"h":5}},
      {"id":6,"type":"stat","title":"Neutron firing alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",alertname=~\".*(Neutron|Network|FloatingIP|SecurityGroup|OVN).*\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":20,"y":1,"w":4,"h":5}},
      {"id":10,"type":"row","title":"Inventory and OVN control plane","gridPos":{"x":0,"y":6,"w":24,"h":1},"panels":[]},
      {"id":11,"type":"stat","title":"Network inventory","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_neutron_networks)","legendFormat":"networks"},{"expr":"max(openstack_neutron_subnets)","legendFormat":"subnets"},{"expr":"max(openstack_neutron_ports)","legendFormat":"ports"},{"expr":"max(openstack_neutron_routers)","legendFormat":"routers"},{"expr":"max(openstack_neutron_floating_ips)","legendFormat":"floating IPs"},{"expr":"max(openstack_neutron_security_groups)","legendFormat":"security groups"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":0,"y":7,"w":10,"h":8}},
      {"id":12,"type":"bargauge","title":"OVN component readiness","description":"northd, NB/SB databases and Neutron API readiness.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max by (deployment) (kube_deployment_status_replicas_ready{namespace=\"openstack\",deployment=~\"neutron-server|ovn-northd\"}) / clamp_min(max by (deployment) (kube_deployment_status_replicas{namespace=\"openstack\",deployment=~\"neutron-server|ovn-northd\"}),1)","legendFormat":"{{deployment}}","instant":true},{"expr":"max by (statefulset) (kube_statefulset_status_replicas_ready{namespace=\"openstack\",statefulset=~\"ovn-ovsdb-nb|ovn-ovsdb-sb\"}) / clamp_min(max by (statefulset) (kube_statefulset_status_replicas{namespace=\"openstack\",statefulset=~\"ovn-ovsdb-nb|ovn-ovsdb-sb\"}),1)","legendFormat":"{{statefulset}}","instant":true}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":0.99},{"color":"green","value":1}]}},"overrides":[]},"options":{"orientation":"horizontal","displayMode":"gradient","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":10,"y":7,"w":14,"h":8}},
      {"id":20,"type":"row","title":"Drift, conflicts and active incidents","gridPos":{"x":0,"y":15,"w":24,"h":1},"panels":[]},
      {"id":21,"type":"timeseries","title":"VPC/Neutron drift and conflicts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (type,project_namespace) (vpc_neutron_drift_resources)","legendFormat":"drift {{project_namespace}} / {{type}}"},{"expr":"sum by (controller,operation) (increase(vpc_neutron_conflicts_total[15m])) or vector(0)","legendFormat":"409 {{controller}} / {{operation}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":16,"w":12,"h":9}},
      {"id":22,"type":"table","title":"Current network alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"ALERTS{alertstate=\"firing\",alertname=~\".*(Neutron|Network|FloatingIP|SecurityGroup|OVN).*\"}","format":"table","instant":true}],"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":12,"y":16,"w":12,"h":9}}
    ]}
