    {"uid":"openstack-nova-operations","title":"OpenStack / Nova Compute Operations","description":"Compute incident workflow: API, service readiness, VM state, agent health, placement capacity and scheduling dependencies.","tags":["openstack","nova","compute"],"schemaVersion":39,"refresh":"30s","time":{"from":"now-6h","to":"now"},"links":[{"title":"Platform overview","url":"/grafana/d/openstack-platform-operations/openstack-platform-operations","type":"link"}],"panels":[
