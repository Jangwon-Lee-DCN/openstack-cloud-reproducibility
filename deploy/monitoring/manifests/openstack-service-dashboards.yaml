      {"id":2,"type":"stat","title":"Keystone exporter check","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"min(openstack_identity_up)","legendFormat":"Keystone"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red"},"1":{"text":"UP","color":"green"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":0,"y":1,"w":4,"h":5}},
      {"id":3,"type":"stat","title":"Identity and project bindings","description":"Identity regions plus namespaces carrying project-scoped OpenStack credentials. Project/user totals are omitted because this exporter deployment does not publish them.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(openstack_identity_regions)","legendFormat":"regions"},{"expr":"count(kube_secret_info{secret=\"openstack-credentials\"})","legendFormat":"credential bindings"},{"expr":"count(kube_namespace_labels{namespace=~\"vpc-.*\"}) or vector(0)","legendFormat":"VPC namespaces"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","orientation":"horizontal","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"gridPos":{"x":4,"y":1,"w":8,"h":5}},
      {"id":4,"type":"stat","title":"Credential/identity alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",alertname=~\".*(Keystone|Identity|Credential|Auth).*\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":12,"y":1,"w":4,"h":5}},
      {"id":5,"type":"stat","title":"Keystone API readiness","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(kube_deployment_status_replicas_ready{namespace=\"openstack\",deployment=\"keystone-api\"})/clamp_min(max(kube_deployment_status_replicas{namespace=\"openstack\",deployment=\"keystone-api\"}),1)","legendFormat":"ready"}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":16,"y":1,"w":4,"h":5}},
      {"id":6,"type":"stat","title":"Missing project bindings","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(ALERTS{alertstate=\"firing\",alertname=\"VPCProjectCredentialBindingMissing\"}) or vector(0)","legendFormat":"missing"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false}},"gridPos":{"x":20,"y":1,"w":4,"h":5}},
      {"id":10,"type":"row","title":"API workload and credential lifecycle","gridPos":{"x":0,"y":6,"w":24,"h":1},"panels":[]},
      {"id":11,"type":"timeseries","title":"Keystone API CPU and memory","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"openstack\",pod=~\"keystone-api-.*\",container!=\"\",image!=\"\"}[5m]))","legendFormat":"CPU {{pod}}"},{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"openstack\",pod=~\"keystone-api-.*\",container!=\"\",image!=\"\"})/1024/1024/1024","legendFormat":"memory GiB {{pod}}"}],"fieldConfig":{"defaults":{"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"right","calcs":["lastNotNull","max"]}},"gridPos":{"x":0,"y":7,"w":12,"h":9}},
      {"id":12,"type":"timeseries","title":"Project credential expiry","description":"Days remaining when controller telemetry is available; zero baseline avoids an ambiguous empty panel while the controller is scaled down.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"(vpc_project_credential_expiry_timestamp_seconds-time())/86400 or vector(0)","legendFormat":"{{project_namespace}}"}],"fieldConfig":{"defaults":{"unit":"d","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":7},{"color":"green","value":30}]}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"right","calcs":["lastNotNull","min"]}},"gridPos":{"x":12,"y":7,"w":12,"h":9}},
      {"id":13,"type":"timeseries","title":"Credential rotations and binding mismatches","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (outcome,reason) (increase(vpc_project_credential_rotations_total[1h])) or vector(0)","legendFormat":"rotation {{outcome}} / {{reason}}"},{"expr":"sum by (reason) (increase(vpc_project_credential_binding_mismatches_total[1h])) or vector(0)","legendFormat":"mismatch {{reason}}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}},"gridPos":{"x":0,"y":16,"w":12,"h":9}},
      {"id":14,"type":"table","title":"Current identity alerts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"ALERTS{alertstate=\"firing\",alertname=~\".*(Keystone|Identity|Credential|Auth).*\"}","format":"table","instant":true}],"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":12,"y":16,"w":12,"h":9}}
    ]}
