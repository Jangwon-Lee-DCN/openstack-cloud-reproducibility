apiVersion: v1
kind: ConfigMap
metadata:
  name: sriov-inventory-evidence
  namespace: openstack
  annotations:
    dcn.ssu.ac.kr/lifecycle: development-only
data:
  run.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    site="${SRIOV_EVIDENCE_SITE:-poc}"
    node="${NODE_NAME:?NODE_NAME is required}"
    interval="${SRIOV_EVIDENCE_INTERVAL_SECONDS:-60}"
    while true; do
      metrics="$(mktemp)"
      found=0
      {
        echo '# TYPE openstack_sriov_pf_total_vfs gauge'
        echo '# TYPE openstack_sriov_pf_configured_vfs gauge'
        echo '# TYPE openstack_sriov_inventory_collected gauge'
        echo '# TYPE openstack_sriov_inventory_last_run_timestamp_seconds gauge'
        for total_path in /host-sys/class/net/*/device/sriov_totalvfs; do
          [ -r "${total_path}" ] || continue
          device="$(basename "$(dirname "$(dirname "${total_path}")")")"
          num_path="$(dirname "${total_path}")/sriov_numvfs"
          [ -r "${num_path}" ] || continue
          total="$(cat "${total_path}")"
          configured="$(cat "${num_path}")"
          case "${total}:${configured}" in (*[!0-9:]*|'':*) continue ;; esac
          printf 'openstack_sriov_pf_total_vfs{node="%s",device="%s"} %s\n' "${node}" "${device}" "${total}"
          printf 'openstack_sriov_pf_configured_vfs{node="%s",device="%s"} %s\n' "${node}" "${device}" "${configured}"
          found=$((found + 1))
        done
        printf 'openstack_sriov_inventory_collected{node="%s"} 1\n' "${node}"
        printf 'openstack_sriov_inventory_pf_count{node="%s"} %s\n' "${node}" "${found}"
        printf 'openstack_sriov_inventory_last_run_timestamp_seconds{node="%s"} %s\n' "${node}" "$(date +%s)"
      } >"${metrics}"
      curl --fail --silent --show-error --max-time 15 --request PUT --data-binary @"${metrics}" \
        "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091/metrics/job/openstack-sriov-inventory/site/${site}/node/${node}"
      rm -f "${metrics}"
      sleep "${interval}"
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sriov-inventory-evidence
  namespace: openstack
  annotations:
    dcn.ssu.ac.kr/lifecycle: development-only
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: sriov-inventory-evidence}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sriov-inventory-evidence}
    spec:
      nodeSelector: {sriov: enabled}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: quay.io/airshipit/openstack-client@sha256:0bc46619c695868ca69657dcb1838e99694a7488ad89c23611cc4ffe49e64ca2
          command: [/bin/bash, /opt/sriov-evidence/run.sh]
          env:
            - {name: SRIOV_EVIDENCE_SITE, value: poc}
            - {name: SRIOV_EVIDENCE_INTERVAL_SECONDS, value: "60"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: script, mountPath: /opt/sriov-evidence, readOnly: true}
            - {name: host-sys, mountPath: /host-sys, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      volumes:
        - {name: script, configMap: {name: sriov-inventory-evidence, defaultMode: 365}}
        - {name: host-sys, hostPath: {path: /sys, type: Directory}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sriov-inventory-evidence
  namespace: openstack
  annotations:
    dcn.ssu.ac.kr/lifecycle: development-only
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sriov-inventory-evidence}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app: prometheus-pushgateway}}
      ports: [{protocol: TCP, port: 9091}]
