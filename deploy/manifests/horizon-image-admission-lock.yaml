apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image == 'registry.dcn.ssu.ac.kr/openstack/horizon:source-213f7b1de7cccf6bcfed@sha256:edaa12a7d174981948fe524466df7dcc97a9af754eb0983d8b84d1fd45de958e')
      message: Horizon may only run the production-approved immutable image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
