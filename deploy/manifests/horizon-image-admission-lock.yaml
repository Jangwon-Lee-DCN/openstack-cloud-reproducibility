apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image == 'registry.dcn.ssu.ac.kr/openstack/horizon:source-b6f32943ef0cf18fdebc@sha256:049f125d6b35770b6ceebed5122fc9a995db5997ee9dc6098f00239eb0e7c016')
      message: Horizon may only run the production-approved immutable image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
