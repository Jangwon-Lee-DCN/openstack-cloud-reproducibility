apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image in [
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-a8a32b63baa09f8d2f7b@sha256:4eb4ad3da67458ad51ec966d6f210347d47dda816230fd47782069dd14a7fe28',
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-8b0b599d902efd9f3a2d@sha256:4704e6363118c9126a1ee182625f47c2d000fe7791cbe745a6280b58fc0cffd0'
          ])
      message: Horizon may only run the production-approved release or rollback image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
