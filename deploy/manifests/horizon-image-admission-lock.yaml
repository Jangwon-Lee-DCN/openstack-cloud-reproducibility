apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image in [
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-cf0d20bcba0f19fdcf3f@sha256:22b467db1559255dcf90857b3751b0e17fd4c05f9700c4a8e61ca4972b4e45ed',
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-821af613d740971fd60e@sha256:347a452da2e7a2e1d4f0dd2faa9d62df08c36409fd1fd26b3408b42e5b3dbcaf'
          ])
      message: Horizon may only run the production-approved release or rollback image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
