apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image in [
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-56ae6999301670a77083@sha256:03c9bea4558f0cd1cc4349be6f9e6b1f4eaa87ce199d32461f43bb8bca8a88ce',
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-331eba4026d38cab0ef3@sha256:e713ae5527fe1a1805cce37ac5395b5d142d9a05ea16c294ca9af95745f264fd'
          ])
      message: Horizon may only run the production-approved release or rollback image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
