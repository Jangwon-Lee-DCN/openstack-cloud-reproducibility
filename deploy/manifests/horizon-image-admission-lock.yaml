apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != 'openstack' ||
        object.metadata.name != 'horizon' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'horizon' &&
          c.image in [
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-405ea71d4e6c161939a7@sha256:7a84670452fa7e94026f5040b3177a9432d60cf7487cfeeb896af52667a48038',
            'registry.dcn.ssu.ac.kr/openstack/horizon:source-3b143ede50340f105785@sha256:4a763abde9c848fe1c2253acc32efeec0526011627e95e029363921cf4c6264a'
          ])
      message: Horizon may only run the production-approved release or rollback image digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: horizon-image-lock.dcn.ssu.ac.kr
spec:
  policyName: horizon-image-lock.dcn.ssu.ac.kr
  validationActions: [Deny]
