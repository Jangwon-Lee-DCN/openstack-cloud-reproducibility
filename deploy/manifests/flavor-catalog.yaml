apiVersion: apps/v1
kind: Deployment
metadata:
  name: flavor-catalog
  namespace: openstack
  labels: {application: flavor-catalog, component: api}
spec:
  replicas: 2
  selector: {matchLabels: {application: flavor-catalog, component: api}}
  template:
    metadata: {labels: {application: flavor-catalog, component: api}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets: [{name: telemetry-harbor-push}]
      nodeSelector: {openstack-control-plane: enabled}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {application: flavor-catalog, component: api}}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: api
          image: FLAVOR_CATALOG_IMAGE
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: nova-keystone-admin}}]
          env:
            - {name: NOVA_ENDPOINT, value: 'http://nova-api.openstack.svc.cluster.local:8774/v2.1'}
            - {name: PLACEMENT_ENDPOINT, value: 'http://placement-api.openstack.svc.cluster.local:8778'}
            - {name: NEUTRON_ENDPOINT, value: 'http://neutron-server.openstack.svc.cluster.local:9696/v2.0'}
            - {name: SRIOV_VF_CAPACITY_PER_HOST, value: '8'}
          securityContext:
            {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true,
             allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
             capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts: [{name: runtime, mountPath: /tmp}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
      volumes: [{name: runtime, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: flavor-catalog
  namespace: openstack
spec:
  selector: {application: flavor-catalog, component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flavor-catalog
  namespace: openstack
spec:
  podSelector: {matchLabels: {application: flavor-catalog}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {application: horizon}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {application: keystone}}
        - podSelector: {matchLabels: {application: nova, component: os-api}}
        - podSelector: {matchLabels: {application: placement}}
        - podSelector: {matchLabels: {application: neutron, component: server}}
      ports:
        - {protocol: TCP, port: 5000}
        - {protocol: TCP, port: 8774}
        - {protocol: TCP, port: 8778}
        - {protocol: TCP, port: 9696}
