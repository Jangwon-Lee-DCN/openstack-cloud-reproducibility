apiVersion: batch/v1
kind: Job
metadata:
  name: horizon-magnum-dashboard-image-build
  namespace: openstack
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      hostAliases:
        - ip: 192.168.21.4
          hostnames: [registry.dcn.ssu.ac.kr]
      nodeSelector:
        openstack-control-plane: enabled
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: extract-context
          image: busybox:1.36
          command: ["sh", "-c", "tar xzf /context-tar/context.tar.gz -C /workspace"]
          volumeMounts:
            - name: context-tar
              mountPath: /context-tar
              readOnly: true
            - name: context
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/Dockerfile
            - --build-arg=HORIZON_BASE=registry.dcn.ssu.ac.kr/openstack/horizon@sha256:6b13cb8e540b6ad752649b686c5348fd355f20f3d09ef8a0186a9fd5ca5556b2
            - --destination=registry.dcn.ssu.ac.kr/openstack/horizon:2026.1-magnum-platform-poc1
            - --digest-file=/dev/termination-log
            - --skip-tls-verify
            - --snapshot-mode=redo
          volumeMounts:
            - name: context
              mountPath: /workspace
              readOnly: true
            - name: registry-auth
              mountPath: /kaniko/.docker
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: context-tar
          configMap:
            name: horizon-magnum-dashboard-image-build
        - name: context
          emptyDir: {}
        - name: registry-auth
          secret:
            secretName: telemetry-harbor-push
            items:
              - key: .dockerconfigjson
                path: config.json
