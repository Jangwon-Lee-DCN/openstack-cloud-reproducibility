apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openstack-public-services
  namespace: openstack
spec:
  parentRefs:
    - name: openstack-public-gateway
      namespace: openstack-gateway-system
      sectionName: https
  hostnames:
    - cloud.dcn.ssu.ac.kr
  rules:
    - matches: [{path: {type: PathPrefix, value: /identity}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: keystone-api, port: 5000}]
    - matches: [{path: {type: PathPrefix, value: /placement}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: placement-api, port: 8778}]
    - matches: [{path: {type: PathPrefix, value: /image}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: glance-api, port: 9292}]
    - matches: [{path: {type: PathPrefix, value: /volume}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: cinder-api, port: 8776}]
    - matches: [{path: {type: PathPrefix, value: /network}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: neutron-server, port: 9696}]
    - matches: [{path: {type: PathPrefix, value: /compute}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: nova-api, port: 8774}]
    - matches: [{path: {type: PathPrefix, value: /novnc}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: nova-novncproxy, port: 6080}]
    - matches: [{path: {type: PathPrefix, value: /orchestration}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: heat-api, port: 8004}]
    - matches: [{path: {type: PathPrefix, value: /baremetal}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: ironic-api, port: 6385}]
    - matches: [{path: {type: PathPrefix, value: /metric}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: gnocchi-api, port: 8041}]
    - matches: [{path: {type: PathPrefix, value: /alarming}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: aodh-api, port: 8042}]
    - matches: [{path: {type: PathPrefix, value: /load-balancer}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: octavia-api, port: 9876}]
    - matches: [{path: {type: PathPrefix, value: /key-manager}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: barbican-api, port: 9311}]
    - matches: [{path: {type: PathPrefix, value: /container-infra}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: magnum-api, port: 9511}]
    - matches: [{path: {type: PathPrefix, value: /horizon}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: horizon-int, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: skyline-api, port: 9999}]
---
# Gateway API limits one HTTPRoute to 16 rules. Keep optional service routes
# separate while sharing the same listener and hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openstack-public-file-share
  namespace: openstack
spec:
  parentRefs:
    - name: openstack-public-gateway
      namespace: openstack-gateway-system
      sectionName: https
  hostnames: [cloud.dcn.ssu.ac.kr]
  rules:
    - matches: [{path: {type: PathPrefix, value: /share}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: manila-api, port: 8786}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openstack-public-instance-ha
  namespace: openstack
spec:
  parentRefs:
    - name: openstack-public-gateway
      namespace: openstack-gateway-system
      sectionName: https
  hostnames: [cloud.dcn.ssu.ac.kr]
  rules:
    - matches: [{path: {type: PathPrefix, value: /instance-ha}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: masakari-api, port: 15868}]
