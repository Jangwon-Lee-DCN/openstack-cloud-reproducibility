apiVersion: v1
kind: ServiceAccount
metadata: {name: glance-image-backup, namespace: openstack}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: glance-image-backup, namespace: openstack}
rules:
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: glance-image-backup, namespace: openstack}
subjects: [{kind: ServiceAccount, name: glance-image-backup, namespace: openstack}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: glance-image-backup}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: glance-image-backup, namespace: openstack}
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: {labels: {application: glance, component: image-backup}}
        spec:
          serviceAccountName: glance-image-backup
          restartPolicy: Never
          nodeSelector: {openstack-control-plane: enabled}
          tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
          containers:
            - name: snapshot
              image: quay.io/airshipit/openstack-client@sha256:8a402a50ecf2afe14f580ad2bae17433605c29063b0d5e2c0f3d3c962d13c656
              command: [python3, -c]
              args:
                - |
                  import datetime,json,os,ssl,urllib.request
                  host=os.environ['KUBERNETES_SERVICE_HOST']; port=os.environ['KUBERNETES_SERVICE_PORT_HTTPS']
                  token=open('/var/run/secrets/kubernetes.io/serviceaccount/token').read(); ca='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                  base=f'https://{host}:{port}/apis/snapshot.storage.k8s.io/v1/namespaces/openstack/volumesnapshots'
                  headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}; ctx=ssl.create_default_context(cafile=ca)
                  stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S')
                  body={'apiVersion':'snapshot.storage.k8s.io/v1','kind':'VolumeSnapshot','metadata':{'name':f'glance-images-{stamp}','labels':{'dcn.ssu.ac.kr/backup':'glance-images'}},'spec':{'volumeSnapshotClassName':'powerstore-snapshot-single-path','source':{'persistentVolumeClaimName':'glance-images'}}}
                  urllib.request.urlopen(urllib.request.Request(base,data=json.dumps(body).encode(),headers=headers,method='POST'),context=ctx).read()
                  items=json.load(urllib.request.urlopen(urllib.request.Request(base+'?labelSelector=dcn.ssu.ac.kr%2Fbackup%3Dglance-images',headers=headers),context=ctx))['items']
                  old=sorted(items,key=lambda x:x['metadata']['creationTimestamp'])[:-7]
                  for item in old: urllib.request.urlopen(urllib.request.Request(base+'/'+item['metadata']['name'],headers=headers,method='DELETE'),context=ctx).read()
                  print(f'created glance-images-{stamp}; retained={len(items)-len(old)}')
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
