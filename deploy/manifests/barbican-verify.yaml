apiVersion: batch/v1
kind: Job
metadata:
  name: barbican-secret-crud
  namespace: openstack
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        application: barbican
        component: acceptance
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: keystone-keystone-admin
          command:
            - /bin/bash
            - -ec
            - |
              payload="$(openssl rand -hex 32)"
              reference="$(openstack secret store --name barbican-e2e \
                --payload "${payload}" --payload-content-type text/plain \
                -f value -c 'Secret href')"
              trap 'openstack secret delete "${reference}" >/dev/null 2>&1 || true' EXIT
              echo "Secret stored; waiting for ACTIVE state."
              for attempt in $(seq 1 30); do
                status="$(openstack secret get "${reference}" -f value -c Status)"
                test "${status}" = ACTIVE && break
                sleep 2
              done
              test "${status}" = ACTIVE
              printf '%s' "${payload}" >/tmp/expected-payload
              openstack secret get --file /tmp/retrieved-payload "${reference}"
              cmp --silent /tmp/expected-payload /tmp/retrieved-payload
              openstack secret delete "${reference}"
              trap - EXIT
              echo "Barbican secret create/get/delete passed."
