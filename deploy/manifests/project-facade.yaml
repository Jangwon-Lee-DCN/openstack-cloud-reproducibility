apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-facade
  namespace: openstack
---
# Role bundles (see docs/proposals/iam-hardening/README.md, "Custom role
# bundles") are the one piece of project-facade's own state that isn't
# Keystone -- persisted here rather than an in-memory dict specifically
# because the Deployment runs 2 replicas; an in-memory dict wouldn't
# even be consistent between them, let alone survive a restart. Scoped
# tightly to exactly this one ConfigMap by resourceName (get/update only,
# never create/delete/list) -- the ConfigMap itself is pre-created below
# so project-facade never needs broader configmap-create permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-facade-role-bundles
  namespace: openstack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["project-facade-role-bundles"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-facade-role-bundles
  namespace: openstack
subjects:
  - kind: ServiceAccount
    name: project-facade
    namespace: openstack
roleRef:
  kind: Role
  name: project-facade-role-bundles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-facade
  namespace: openstack
  labels:
    application: project-facade
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      application: project-facade
      component: api
  template:
    metadata:
      labels:
        application: project-facade
        component: api
    spec:
      serviceAccountName: project-facade
      imagePullSecrets:
        - name: telemetry-harbor-push
      containers:
        - name: project-facade
          image: registry.dcn.ssu.ac.kr/openstack/project-facade@sha256:24ccf2db073a8b5cdec61ec208eda2404b07d27d8ae29be5a962934cc524c2c1
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: project-facade-keystone
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: project-facade
  namespace: openstack
  labels:
    application: project-facade
    component: api
spec:
  selector:
    application: project-facade
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
