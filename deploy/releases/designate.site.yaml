# HA Designate control services backed by the in-cluster PowerDNS deployment.
# Runtime credentials are supplied from secrets/designate.values.sops.yaml.
images:
  tags:
    bootstrap: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_init: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_drop: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_service: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_endpoints: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    designate_db_sync: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_api: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_central: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_mdns: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_worker: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_producer: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_sink: quay.io/airshipit/designate:2026.1-ubuntu_noble
    designate_service_cleaner: quay.io/airshipit/designate:2026.1-ubuntu_noble

# One-shot control jobs do not need host networking or controller-local state.
# Keep them on untainted compute nodes; the long-running control services use
# the controller toleration below.
labels:
  job:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled
  service_cleaner:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled

pod:
  host_network:
    mdns: true
    worker: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    anti:
      type:
        default: requiredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
  replicas:
    api: 2
    central: 2
    mdns: 2
    producer: 2
    worker: 2
  lifecycle:
    disruption_budget:
      api:
        min_available: 1
      central:
        min_available: 1
      mdns:
        min_available: 1
      producer:
        min_available: 1
      worker:
        min_available: 1
  resources:
    enabled: true

conf:
  designate_api_uwsgi:
    uwsgi:
      wsgi-file: /tmp/designate-api-wsgi
  designate:
    service:api:
      workers: 2
    service:central:
      workers: 1
    service:mdns:
      workers: 1
    service:producer:
      workers: 1
    service:worker:
      workers: 1
  pools: |
    - name: default
      description: DCN PoC authoritative DNS pool
      attributes: {}
      ns_records:
        - hostname: ns1.cloud.dcn.ssu.ac.kr.
          priority: 1
      nameservers:
        - host: 192.168.21.9
          port: 53
      targets:
        - type: pdns4
          description: HA PowerDNS authoritative backend
          masters:
            # Cilium SNATs node-originated LoadBalancer traffic to its stable
            # per-node cilium_host address.  These addresses also reach the
            # host-networked mDNS listeners and therefore satisfy PowerDNS'
            # strict NOTIFY-source/primary matching.
            - host: 10.200.0.143
              port: 5354
            - host: 10.200.1.191
              port: 5354
          options:
            host: 192.168.21.9
            port: 53
            api_endpoint: http://powerdns.openstack.svc.cluster.local:8081
            api_token: {{ tuple "powerdns" "service" . | include "helm-toolkit.endpoints.endpoint_token_lookup" }}

endpoints:
  identity:
    auth:
      admin:
        region_name: RegionOne
        project_name: admin
  dns:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /dns
    scheme:
      public: https
    port:
      api:
        public: 443

manifests:
  ingress_api: false
  secret_ingress_tls: false
  service_ingress_api: false
  secret_registry: false
