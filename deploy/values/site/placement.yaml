# Site override for the pinned OpenStack-Helm Placement chart.
pod:
  tolerations:
    placement:
      enabled: true
  replicas:
    api: 2
  lifecycle:
    disruption_budget:
      api:
        min_available: 1
conf:
  # Capacity and scheduling evidence is read-only. Monitoring can explain
  # provider eligibility, but cannot inspect consumer allocations or mutate
  # Placement state.
  policy:
    "placement:allocation_candidates:list": "role:admin or role:monitoring"
    "placement:resource_providers:list": "role:admin or role:monitoring"
    "placement:resource_providers:inventories:list": "role:admin or role:monitoring"
    "placement:resource_providers:traits:list": "role:admin or role:monitoring"
    "placement:resource_providers:usages": "role:admin or role:monitoring"
    "placement:traits:list": "role:admin or role:monitoring"
endpoints:
  identity:
    auth:
      admin:
        region_name: seoul-ssu-1
        project_name: admin
  placement:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /placement
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_api: false
  service_ingress_api: false
