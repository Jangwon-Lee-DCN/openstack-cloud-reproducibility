# HA Nova control services with a single PoC compute daemon on controller-0.
# Ephemeral instance disks remain local qcow2; Ceph is object-only.
pod:
  tolerations:
    nova:
      enabled: true
  replicas:
    api_metadata: 2
    osapi: 2
    conductor: 2
    scheduler: 2
    novncproxy: 2
  lifecycle:
    disruption_budget:
      metadata:
        min_available: 1
      osapi:
        min_available: 1
images:
  tags:
    nova: &nova_image registry.dcn.ssu.ac.kr/openstack/nova-extended-compute:source-862f2f63a6afc78ee703@sha256:6d92b55e745b6781db327ee5ae5ce36ddab4190a5b8a01b627f2ec71ce932780
    nova_api: *nova_image
    nova_cell_setup: *nova_image
    nova_compute: *nova_image
    nova_compute_ssh: *nova_image
    nova_conductor: *nova_image
    nova_db_sync: *nova_image
    nova_novncproxy: *nova_image
    nova_novncproxy_assets: *nova_image
    nova_scheduler: *nova_image
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
conf:
  ceph:
    enabled: false
  # Read-only exporter access. No create, update, or delete rule is granted.
  policy:
    "os_compute_api:os-services:list": "role:admin or role:monitoring"
    # Preserve Nova's project-user defaults. These endpoints are required by
    # Horizon's project overview and instance workflows; narrowing them to
    # monitoring accidentally locks out ordinary federated members/readers.
    "os_compute_api:os-availability-zone:list": "@"
    "os_compute_api:limits": "@"
    "os_compute_api:limits:other_project": "role:admin or role:monitoring"
    "os_compute_api:os-hypervisors:list-detail": "role:admin or role:monitoring"
    "os_compute_api:servers:detail:get_all_tenants": "role:admin or role:monitoring"
    "os_compute_api:os-simple-tenant-usage:list": "role:admin or role:monitoring"
  nova:
    flyt:
      enabled: true
      adapter_endpoint: http://flyt-adapter.flyt-system.svc.cluster.local:8080
      timeout: 60
    api:
      vendordata_providers: StaticJSON,DynamicJSON
      vendordata_dynamic_targets: cloud-init@http://flyt-adapter.flyt-system.svc.cluster.local:8080/v1/nova/vendor-data
      vendordata_dynamic_connect_timeout: 5
      vendordata_dynamic_read_timeout: 5
      vendordata_dynamic_failure_fatal: true
    vendordata_dynamic_auth:
      auth_type: admin_token
      endpoint: http://flyt-adapter.flyt-system.svc.cluster.local:8080
    oslo_policy:
      enforce_new_defaults: true
      enforce_scope: false
    libvirt:
      images_type: qcow2
    # The Rack 1 GPU host exposes one complete RTX 3090 Ti IOMMU group.  Both
    # the display and HDMI-audio functions must be requested together.
    pci:
      report_in_placement: false
      # helm-toolkit joins YAML lists with commas, which is invalid for Nova's
      # MultiStrOpt JSON parser. device_spec officially accepts one JSON list;
      # alias requires repeated INI keys, rendered here as a trusted scalar.
      # The single-NUMA-node GPU host reports PCI numa_node=-1, so Nova's
      # legacy policy is required to allow the documented no-affinity fallback.
      device_spec: '[{"address":"0000:01:00.0","vendor_id":"10de","product_id":"2203","managed":"yes"},{"address":"0000:01:00.1","vendor_id":"10de","product_id":"1aef","managed":"yes"}]'
      alias: |-
        {"name":"rtx3090ti","vendor_id":"10de","product_id":"2203","device_type":"type-PCI","numa_policy":"legacy"}
        alias = {"name":"rtx3090ti-audio","vendor_id":"10de","product_id":"1aef","device_type":"type-PCI","numa_policy":"legacy"}
    filter_scheduler:
      enabled_filters:
        - ComputeFilter
        - ComputeCapabilitiesFilter
        - AggregateInstanceExtraSpecsFilter
        - ImagePropertiesFilter
        - NUMATopologyFilter
        - PciPassthroughFilter
        - ServerGroupAntiAffinityFilter
        - ServerGroupAffinityFilter
endpoints:
  identity:
    auth:
      admin:
        region_name: seoul-ssu-1
        project_name: admin
  compute:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /compute/v2.1/
    scheme:
      public: https
    port:
      api:
        public: 443
  compute_novnc_proxy:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /novnc/vnc_auto.html
    scheme:
      public: https
    port:
      novnc_proxy:
        public: 443
manifests:
  ingress_metadata: false
  ingress_novncproxy: false
  ingress_serialproxy: false
  ingress_spiceproxy: false
  ingress_osapi: false
  service_ingress_metadata: false
  service_ingress_novncproxy: false
  service_ingress_serialproxy: false
  service_ingress_spiceproxy: false
  service_ingress_osapi: false
  deployment_serialproxy: false
  deployment_spiceproxy: false
  service_serialproxy: false
  service_spiceproxy: false
