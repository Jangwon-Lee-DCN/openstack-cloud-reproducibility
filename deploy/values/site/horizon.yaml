# HA Horizon dashboard at the cloud root URL.
images:
  tags:
    horizon: registry.dcn.ssu.ac.kr/openstack/horizon:source-93c77fb466a2da536c9b@sha256:85f1de9439fcefb50443683d0d7e2a65496295f569994c0b31b80932c4da250f
pod:
  # Internal endpoint names already contain multiple labels. ndots:5 makes
  # glibc query an impossible search-suffixed name before the real service
  # FQDN, and one lost DNS packet adds the default five-second retry to an
  # otherwise fast dashboard request.
  dns_config:
    options:
      - name: ndots
        value: "2"
      - name: timeout
        value: "1"
      - name: attempts
        value: "3"
      - name: single-request-reopen
  image_pull_secrets:
    horizon:
      - name: telemetry-harbor-push
  topology_spread_constraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      # Keep rolling upgrades possible while one rack's controller is cordoned.
      # The scheduler still prefers even rack placement and will use another
      # healthy rack instead of deadlocking the Deployment rollout.
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          application: horizon
          component: server
  tolerations:
    horizon:
      enabled: true
  replicas:
    # One replica per rack prevents a slow API-bound WSGI request on either of
    # two pods from becoming visible as whole-dashboard navigation stalls.
    server: 3
  lifecycle:
    disruption_budget:
      horizon:
        min_available: 2
    # Allow endpoint withdrawal plus Apache's graceful worker shutdown to
    # finish before kubelet sends SIGKILL during a rollout.
    termination_grace_period:
      horizon:
        timeout: 60
  resources:
    enabled: true
    server:
      requests:
        memory: 768Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: "2"
conf:
  horizon:
    local_settings:
      config:
        auth:
          sso:
            enabled: true
            initial_choice: keycloak_dcn
            websso_keystone_url: https://cloud.dcn.ssu.ac.kr/identity/v3
            # Keycloak's public frontend is reverse-proxied below /horizon;
            # one-step WebSSO therefore stays on the Horizon public origin.
            default_redirect: true
            default_redirect_protocol: openid
            default_redirect_region: https://cloud.dcn.ssu.ac.kr/identity/v3
            default_redirect_logout: "https://cloud.dcn.ssu.ac.kr/identity/v3/OS-FEDERATION/oidc-callback?logout=https%3A%2F%2Fcloud.dcn.ssu.ac.kr%2Fhorizon%2Fauth%2Flogin%2F"
          idp_mapping:
            - name: keycloak_dcn
              label: DCN Keycloak SSO
              idp: keycloak-dcn
              protocol: openid
        use_ssl: "True"
        endpoint_type: internalURL
        # A bare YAML boolean here renders lowercase ("true"/"false") into
        # local_settings.py's raw Python source via this chart's
        # unquoted {{ .Values...enable_backup }} template (values.yaml
        # line ~558) -- invalid Python (NameError: name 'true' is not
        # defined), confirmed live: crash-looped every new Horizon pod
        # during a routine digest bump, saved only by the disruption
        # budget keeping one old-image replica alive throughout. Must be
        # the quoted Python-literal string "True"/"False", matching the
        # chart's own default (enable_backup: "True" in values.yaml).
        openstack_cinder_features:
          enable_backup: "True"
        csrf_cookie_secure: "True"
        session_cookie_secure: "True"
        secure_proxy_ssl_header: true
        # The chart default (django.contrib.sessions.backends.cache, backed
        # by memcached.openstack.svc.cluster.local:11211) breaks with 2
        # Horizon replicas: that Service round-robins across two
        # independent, non-clustered memcached-memcached-0/1 Pods (confirmed
        # empirically -- each holds a different, large item count, so a
        # session written via one Pod is simply absent when a later request
        # lands on the other). Every login appeared to succeed (302 to
        # /horizon/) but the very next request was bounced straight back to
        # the login page with the sessionid cookie cleared. signed_cookies is
        # also unsuitable: the domain-scoped token and service catalog make
        # the cookie exceed the browser's 4096-byte limit. Store sessions in
        # the shared Horizon MariaDB instead; both replicas use the same
        # django_session table and the browser carries only a short key.
        session_engine: 'django.contrib.sessions.backends.db'
        # The chart runs collectstatic + compressor with this same runtime
        # configuration before Apache starts, so the generated manifest already
        # contains the /horizon prefix. Use it at request time instead of
        # recompiling template blocks in every WSGI worker (2-3 seconds per
        # login-page render in the accepted production topology).
        compress_offline: true
        csrf_trusted_origins:
          - https://cloud.dcn.ssu.ac.kr
        allowed_hosts:
          - cloud.dcn.ssu.ac.kr
        # FORCE_SCRIPT_NAME and explicit /horizon/-prefixed LOGIN_URL etc.
        # are BOTH required, because they cover two different Django code
        # paths that do not share prefixing logic:
        #
        # 1. Dynamically generated URLs (reverse()/{% url %} -- e.g. the
        #    login form's own `action` attribute) are prefixed by
        #    FORCE_SCRIPT_NAME automatically. Confirmed by removing it
        #    once: the form action fell back to bare "/auth/login/",
        #    submitting to the domain root (landing behind the "/"
        #    catch-all route instead of Horizon) and 405'ing.
        # 2. Horizon's HorizonMiddleware unauthenticated-access redirect
        #    calls Django's redirect_to_login(), which calls
        #    resolve_url(settings.LOGIN_URL) -- and resolve_url() returns
        #    a plain path string (one not starting with "./" or "../" and
        #    not a reversible URL name) COMPLETELY UNCHANGED (verified
        #    against Django's actual source, django/shortcuts.py).
        #    FORCE_SCRIPT_NAME is never consulted for this path. Confirmed
        #    by setting LOGIN_URL to the bare "/auth/login/" once: visiting
        #    /horizon/ while logged out redirected to
        #    "https://cloud.dcn.ssu.ac.kr/auth/login/?next=/horizon/" --
        #    no /horizon/ prefix at all, landing on the "/" catch-all
        #    route (skyline-api) instead of Horizon.
        #
        # So LOGIN_URL/LOGOUT_URL/LOGIN_REDIRECT_URL/STATIC_URL must carry
        # the explicit prefix (path (2) needs it and gets no help from
        # FORCE_SCRIPT_NAME), while FORCE_SCRIPT_NAME must also stay set
        # (path (1) needs it). This does NOT double-prefix: resolve_url()
        # on an already-absolute path is a no-op, it doesn't add a second
        # copy of FORCE_SCRIPT_NAME on top. (The earlier
        # /horizon/horizon/auth/login/ double-prefix seen during
        # investigation came from a different cause, not from this
        # combination -- see docs/09-horizon-login-loop-incident.md.)
        # Re-verify both code paths (the login form's rendered `action`
        # attribute AND a fresh unauthenticated GET of /horizon/) after
        # touching any of these four settings; each one only exercises
        # one of the two paths, and both must be checked independently.
        raw:
          # English is the platform default for new sessions. Asia/Seoul is
          # UTC+9 year-round and is Django's canonical South Korea zone name.
          # A user's saved Horizon preference may still override these defaults.
          LANGUAGE_CODE: en
          TIME_ZONE: Asia/Seoul
          FORCE_SCRIPT_NAME: /horizon
          WEBROOT: /horizon/
          # Horizon replicas share the Django cache. Caching this fragment
          # lets a rolling-upgrade pod reuse the previous image's external
          # template list and emit a different hashed preload JS than its
          # peer, causing cross-pod 404s and broken Angular modals.
          NG_TEMPLATE_CACHE_AGE: 0
          LOGIN_URL: /horizon/auth/login/
          LOGOUT_URL: /horizon/auth/logout/
          LOGIN_REDIRECT_URL: /horizon/
          STATIC_URL: /horizon/static/
endpoints:
  identity:
    auth:
      admin:
        region_name: seoul-ssu-1
        project_name: admin
  dashboard:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    scheme:
      public: https
    port:
      web:
        public: 443
network:
  dashboard:
    # Keep a browser/Gateway flow on one replica long enough to reuse Horizon's
    # short-lived API caches. Kubernetes remaps it automatically on pod failure.
    session_affinity: ClientIP
    session_affinity_timeout: 10800
manifests:
  ingress_api: false
  service_ingress: false
