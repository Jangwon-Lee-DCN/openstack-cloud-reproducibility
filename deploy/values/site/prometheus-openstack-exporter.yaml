# The upstream chart does not expose pod tolerations. The installer adds the
# control-plane toleration after Helm renders this controller-1-only workload.
conf:
  prometheus_openstack_exporter:
    # The public catalog currently presents the cert-manager self-signed
    # Gateway certificate. Keep this explicit final site override until the
    # institutional CA bundle is installed. Without it, the older encrypted
    # values snapshot renders TLS verification on and every collector reports
    # *_up=0 after x509 validation failures.
    verify: false
    extra_args:
      - --endpoint-type=internal

labels:
  openstack_exporter:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled

pod:
  affinity:
    anti:
      type:
        default: requiredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: topology.kubernetes.io/zone
  replicas:
    prometheus_openstack_exporter: 3
