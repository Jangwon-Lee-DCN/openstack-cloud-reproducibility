# Neutron ML2/OVN with Geneve tenant overlays and the eno2-backed flat
# provider network. OVN metadata agents run beside both OVN controllers.
pod:
  tolerations:
    neutron:
      enabled: true
  replicas:
    # Horizon consults Neutron capabilities on most project panels. Keep one
    # API replica per rack so a blocked worker cannot stall dashboard traffic.
    server: 3
  lifecycle:
    disruption_budget:
      server:
        min_available: 2
images:
  tags:
    neutron_db_sync: registry.dcn.ssu.ac.kr/openstack/neutron@sha256:85dfce6a687aac4df39e5cf5197dcee81a754a1da598225de9795cbbadfdca97
    neutron_server: registry.dcn.ssu.ac.kr/openstack/neutron@sha256:85dfce6a687aac4df39e5cf5197dcee81a754a1da598225de9795cbbadfdca97
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
dependencies:
  static:
    ovn_metadata:
      # Nova is installed after Neutron. The agent retries Nova metadata at
      # runtime, so requiring a ready nova-metadata endpoint here deadlocks
      # the deterministic install order.
      services:
        - endpoint: internal
          service: network
conf:
  neutron:
    DEFAULT:
      # A single eventlet API worker allowed one /extensions request to block
      # an entire replica for 65 seconds. Multiple worker processes isolate
      # slow control-plane requests while preserving the API contract.
      api_workers: 4
      # Do not force the legacy "nova" network AZ. OVN gateway chassis are
      # rack-scoped (rack-1/2/3), while generic tenant networks such as those
      # created by CAPO must remain usable across racks unless the caller
      # explicitly supplies an availability-zone hint.
      default_availability_zones: ""
      global_physnet_mtu: 1500
      router_distributed: true
      # Host-side privsep creates this socket with the host neutron UID, while
      # the container uses the image UID. Permit the OVN metadata proxy to
      # connect across that intentional UID boundary.
      metadata_proxy_socket_mode: all
      service_plugins: ovn-router,firewall_v2,log
    service_providers:
      service_provider: FIREWALL_V2:fwaas_db:neutron_fwaas.services.firewall.service_drivers.ovn.firewall_l3_driver.OVNFwaasDriver:default
  plugins:
    ml2_conf:
      ml2:
        type_drivers: flat,geneve
        tenant_network_types: geneve
        mechanism_drivers: ovn
        extension_drivers: port_security
      ml2_type_flat:
        flat_networks: external-rack-1,external-rack-2,external-rack-3
      ml2_type_geneve:
        vni_ranges: 1:65536
        max_header_size: 38
      ovn:
        ovn_l3_scheduler: leastloaded
        neutron_sync_mode: repair
        # Rack-local VLAN 140 domains are not stretched. Keep north-south
        # translation on the router's AZ-constrained gateway chassis.
        enable_distributed_floating_ip: false
        dns_servers: 192.168.21.10,8.8.8.8,1.1.1.1
      network_log:
        rate_limit: 150
        burst_limit: 50
endpoints:
  identity:
    auth:
      admin:
        region_name: seoul-ssu-1
        project_name: admin
  network:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /network
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_server: false
  service_ingress_server: false
