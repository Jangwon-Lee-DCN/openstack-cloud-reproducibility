pod:
  tolerations:
    keystone:
      enabled: true
  replicas:
    api: 2
images:
  tags:
    keystone_api: registry.dcn.ssu.ac.kr/openstack/keystone@sha256:65ccaa7935753352ac329d325aa77edab9bc3bf42ad2b2f73fc884657c9eb656
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
conf:
  keystone:
    resource:
      # Service-to-service requests must see resources across tenant projects.
      admin_project_domain_name: service
      admin_project_name: service
  # Project-scoped exporter 1.7.0 compatibility: read-only inventory only.
  policy:
    "identity:list_projects": "role:admin or role:monitoring"
    "identity:list_users": "role:admin or role:monitoring"
    "identity:list_groups": "role:admin or role:monitoring"
    "identity:list_domains": "role:admin or role:monitoring"
endpoints:
  identity:
    auth:
      admin:
        region_name: RegionOne
        project_name: admin
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /identity/v3
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_api: false
  service_ingress_api: false
