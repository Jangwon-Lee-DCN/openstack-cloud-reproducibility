pod:
  tolerations:
    keystone:
      enabled: true
  image_pull_secrets:
    keystone:
      - name: telemetry-harbor-push
  replicas:
    api: 2
  env:
    keystone_api:
      - name: CURL_CA_BUNDLE
        value: /usr/local/share/ca-certificates/openstack-public-ca.crt
  mounts:
    keystone_api:
      keystone_api:
        volumeMounts:
          # Replace the image-baked temporary CA with the currently issued
          # public Gateway CA. The existing update-ca-certificates hash link
          # then resolves to this live certificate without disabling TLS
          # verification in mod_auth_openidc.
          - name: openstack-public-ca
            mountPath: /usr/local/share/ca-certificates/openstack-public-ca.crt
            subPath: ca.crt
            readOnly: true
        volumes:
          - name: openstack-public-ca
            configMap:
              name: openstack-public-ca
images:
  tags:
    keystone_api: registry.dcn.ssu.ac.kr/openstack/keystone@sha256:5c4a6ecb5ec01d6de6f273ad39a8330058e5df49660477fc9aedaf0e8fb5727e
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
conf:
  keystone:
    resource:
      # Service-to-service requests must see resources across tenant projects.
      admin_project_domain_name: service
      admin_project_name: service
  # Project-scoped exporter 1.7.0 compatibility: read-only inventory only.
  policy:
    "identity:list_projects": "role:admin or role:monitoring"
    "identity:list_users": "role:admin or role:monitoring"
    "identity:list_groups": "role:admin or role:monitoring"
    "identity:list_domains": "role:admin or role:monitoring"
endpoints:
  identity:
    auth:
      admin:
        region_name: RegionOne
        project_name: admin
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /identity/v3
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_api: false
  service_ingress_api: false
