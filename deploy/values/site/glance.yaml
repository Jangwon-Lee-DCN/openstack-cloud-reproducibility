# PowerStore-backed image PVC. The CSI node plugin is intentionally limited to
# compute nodes, so the initial RWO deployment is a single API replica.
storage: pvc
conf:
  # A single uWSGI worker is occupied for the full duration of a multi-GB image
  # download. Kubernetes health checks then time out and kill that worker,
  # truncating Nova's Glance stream. Keep independent workers available for
  # probes and metadata requests while an image is streamed.
  glance_api_uwsgi:
    uwsgi:
      processes: 4
pod:
  tolerations:
    glance:
      enabled: true
  replicas:
    api: 1
  lifecycle:
    disruption_budget:
      api:
        min_available: 1
images:
  tags:
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
endpoints:
  identity:
    auth:
      admin:
        region_name: RegionOne
        project_name: admin
  image:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /image
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_api: false
  service_ingress_api: false
volume:
  class_name: powerstore-rwo-single-path
  size: 100Gi
  accessModes:
    - ReadWriteOnce
labels:
  api:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled
