# Control-only Ironic PoC. No PXE, HTTP boot, cleaning network, or image bootstrap.
images:
  tags:
    ironic_manage_cleaning_network: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ironic_retrive_swift_config: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    bootstrap: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_drop: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_init: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ironic_db_sync: quay.io/airshipit/ironic:2026.1-ubuntu_noble
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_service: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_endpoints: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    rabbit_init: quay.io/airshipit/rabbitmq:3.10.18-management
    ironic_api: quay.io/airshipit/ironic:2026.1-ubuntu_noble
    ironic_conductor: quay.io/airshipit/ironic:2026.1-ubuntu_noble
    ironic_pxe: quay.io/airshipit/ironic:2026.1-ubuntu_noble
    ironic_pxe_init: quay.io/airshipit/ironic:2026.1-ubuntu_noble
conf:
  ironic:
    DEFAULT:
      # Redfish virtual-media uses hardlinks from master_iso_images. Keep the
      # temporary build directory on the same /var/lib/ironic filesystem.
      tempdir: /var/lib/ironic/tmp
      isolinux_bin: /var/lib/ironic/boot-tools/isolinux.bin
      ldlinux_c32: /var/lib/ironic/boot-tools/ldlinux.c32
    api:
      workers: 4
    pxe:
      # Temporary PoC exception for the self-signed internal Gateway CA.
      # Production IPA images must trust the institutional CA instead.
      pxe_append_params: "nofb nomodeset vga=normal ipa-debug=1 ipa-insecure=1"
    redfish:
      # Redfish virtual-media has its own kernel parameter namespace and does
      # not inherit [pxe]. Remove ipa-insecure in production after IPA trusts
      # the institutional CA used by the internal OpenStack API Gateway.
      kernel_append_params: "nofb nomodeset vga=normal console=ttyS0,115200n8 ipa-debug=1 ipa-insecure=1"
    service_catalog:
      # IPA cannot reach the Kubernetes ClusterIP catalog endpoint. Advertise
      # the VM-routable internal Gateway callback URL instead.
      endpoint_override: https://internal.cloud.dcn.ssu.ac.kr/baremetal
conductor:
  pxe:
    enabled: false
  http:
    # Required by redfish-virtual-media. This exposes only the generated boot
    # artifacts on TCP/8080; PXE/TFTP and DHCP remain disabled.
    enabled: true
bootstrap:
  image:
    enabled: false
  object_store:
    enabled: false
dependencies:
  static:
    api:
      jobs: [ironic-db-sync, ironic-ks-user, ironic-ks-endpoints, ironic-rabbit-init]
    conductor:
      jobs: [ironic-db-sync, ironic-ks-user, ironic-ks-endpoints, ironic-rabbit-init]
pod:
  tolerations:
    ironic:
      enabled: true
  replicas:
    api: 2
    conductor: 2
  lifecycle:
    disruption_budget:
      api:
        min_available: 1
network:
  pxe:
    # Use the stable additive fabric interface shared by every conductor
    # candidate; never bind provisioning services to the installer DHCP NIC.
    device: dcn-control0
endpoints:
  identity:
    auth:
      admin:
        region_name: RegionOne
        project_name: admin
  baremetal:
    host_fqdn_override:
      public:
        host: cloud.dcn.ssu.ac.kr
    path:
      public: /baremetal
    scheme:
      public: https
    port:
      api:
        public: 443
manifests:
  ingress_api: false
  service_ingress_api: false
  job_manage_cleaning_network: false
  job_bootstrap: false
