apiVersion: apps/v1
kind: Deployment
metadata:
  name: p0-core-orchestration
  namespace: __NAMESPACE__
  labels: {app.kubernetes.io/name: p0-core-orchestration}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: p0-core-orchestration}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p0-core-orchestration
        dcn.ssu.ac.kr/development-ingress: allowed
        dcn.ssu.ac.kr/p0-real-provider: allowed
        dcn.ssu.ac.kr/central-opa-client: allowed
    spec:
      initContainers:
        - name: migrate
          image: __IMAGE__
          command: [python, -m, core.migrate]
          env:
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: database-url}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
      priorityClassName: dcn-development-interruptible
      nodeSelector: {dcn.ssu.ac.kr/workload-class: development}
      tolerations:
        - {key: dcn.ssu.ac.kr/workload-class, operator: Equal, value: development, effect: NoSchedule}
        - {key: node-role.kubernetes.io/utility, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: CORE_RUNTIME_MODE, value: real-openstack}
            - {name: CORE_AUTH_MODE, value: keystone-opa}
            - {name: CORE_KEYSTONE_URL, value: "http://keystone-api.openstack.svc.cluster.local:5000/v3"}
            - {name: CORE_OPA_DECISION_URL, value: "http://opa-pilot.vpc-control-plane-system.svc.cluster.local:8181/v1/data/vpc/authz/decision"}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: database-url}}
            - name: CORE_APPROVAL_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: p0-core-orchestration, key: signing-key}}
            - name: CORE_AODH_EVENT_KEY
              valueFrom: {secretKeyRef: {name: p0-core-orchestration, key: event-key}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts: [{name: data, mountPath: /data}]
        - name: worker
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -m, core.worker_main]
          env:
            - {name: CORE_RUNTIME_MODE, value: real-openstack}
            - {name: WORKER_POLL_SECONDS, value: "1"}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: database-url}}
            - {name: OS_NOVA_ENDPOINT, value: "http://nova-api.openstack.svc.cluster.local:8774/v2.1"}
            - {name: OS_NEUTRON_ENDPOINT, value: "http://neutron-server.openstack.svc.cluster.local:9696"}
            - {name: OS_CINDER_ENDPOINT, value: "http://cinder-api.openstack.svc.cluster.local:8776"}
            - {name: OS_PLACEMENT_ENDPOINT, value: "http://placement-api.openstack.svc.cluster.local:8778"}
            - {name: OS_OCTAVIA_ENDPOINT, value: "http://octavia-api.openstack.svc.cluster.local:9876"}
            - {name: OS_AODH_ENDPOINT, value: "http://aodh-api.openstack.svc.cluster.local:8042"}
          envFrom: [{secretRef: {name: p0-openstack-provider}}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts: [{name: data, mountPath: /data}]
        - name: scheduler
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -m, core.scheduler_main]
          env:
            - {name: CORE_RUNTIME_MODE, value: real-openstack}
            - {name: SCHEDULER_POLL_SECONDS, value: "5"}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: database-url}}
            - {name: OS_NOVA_ENDPOINT, value: "http://nova-api.openstack.svc.cluster.local:8774/v2.1"}
            - {name: OS_NEUTRON_ENDPOINT, value: "http://neutron-server.openstack.svc.cluster.local:9696"}
            - {name: OS_CINDER_ENDPOINT, value: "http://cinder-api.openstack.svc.cluster.local:8776"}
          envFrom: [{secretRef: {name: p0-openstack-provider}}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts: [{name: data, mountPath: /data}]
        - name: outbox
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -m, core.outbox_main]
          env:
            - {name: CORE_RUNTIME_MODE, value: real-openstack}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: database-url}}
            - name: CORE_RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: rabbitmq-url}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: p0-core-postgresql, namespace: __NAMESPACE__}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: p0-core-postgresql}
  ports: [{name: postgresql, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: p0-core-postgresql, namespace: __NAMESPACE__}
spec:
  serviceName: p0-core-postgresql
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: p0-core-postgresql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: p0-core-postgresql}}
    spec:
      nodeSelector: {dcn.ssu.ac.kr/workload-class: development}
      tolerations:
        - {key: dcn.ssu.ac.kr/workload-class, operator: Equal, value: development, effect: NoSchedule}
        - {key: node-role.kubernetes.io/utility, operator: Equal, value: "true", effect: NoSchedule}
      securityContext: {runAsNonRoot: true, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgresql
          image: docker.io/bitnamilegacy/postgresql@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d
          env:
            - {name: POSTGRESQL_DATABASE, value: core}
            - {name: POSTGRESQL_USERNAME, value: core}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: p0-core-backends, key: postgres-password}}
          ports: [{name: postgresql, containerPort: 5432}]
          readinessProbe: {tcpSocket: {port: postgresql}, periodSeconds: 5}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: false
            runAsUser: 1001
          volumeMounts: [{name: data, mountPath: /bitnami/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: dcn-local-rwo
        resources: {requests: {storage: 1Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: p0-core-real-integrations, namespace: __NAMESPACE__}
spec:
  podSelector: {matchLabels: {dcn.ssu.ac.kr/p0-real-provider: allowed}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openstack}}}]
      ports:
        - {protocol: TCP, port: 5000}
        - {protocol: TCP, port: 5672}
        - {protocol: TCP, port: 8774}
        - {protocol: TCP, port: 9696}
        - {protocol: TCP, port: 8776}
        - {protocol: TCP, port: 8778}
        - {protocol: TCP, port: 9876}
        - {protocol: TCP, port: 8042}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: vpc-control-plane-system}
          podSelector:
            matchLabels: {app: opa-pilot}
      ports: [{protocol: TCP, port: 8181}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: p0-core-postgresql}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: p0-core-postgresql-ingress, namespace: __NAMESPACE__}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: p0-core-postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: p0-core-orchestration}}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: p0-core-orchestration, namespace: __NAMESPACE__}
spec:
  selector: {app.kubernetes.io/name: p0-core-orchestration}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: p0-core-orchestration, namespace: __NAMESPACE__}
spec:
  parentRefs:
    - {name: development-gateway, namespace: development-gateway-system, sectionName: https}
  hostnames: ["p0-core-orchestration.dev.dcn.ssu.ac.kr"]
  rules: [{backendRefs: [{name: p0-core-orchestration, port: 80}]}]
