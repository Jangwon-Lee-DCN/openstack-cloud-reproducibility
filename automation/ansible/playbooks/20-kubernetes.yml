---
- name: Validate live Kubernetes host prerequisites
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read required live sysctls
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - net.ipv4.ip_forward
          - net.bridge.bridge-nf-call-iptables
          - net.bridge.bridge-nf-call-ip6tables
          - net.ipv4.conf.all.rp_filter
      register: kubernetes_live_sysctls
      changed_when: false
      check_mode: false

    - name: Require the Phase 10 live sysctl contract
      ansible.builtin.assert:
        that:
          - kubernetes_live_sysctls.stdout_lines == ['1', '1', '1', '0']
        fail_msg: Rerun Phase 10 to reconcile the live Kubernetes sysctl contract.

- name: Initialize the first Kubernetes control plane
  hosts: control_plane[0]
  become: true
  roles:
    - kubeadm_init
  post_tasks:
    - name: Fetch the administrative kubeconfig to the Ansible control host
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../artifacts/admin.conf"
        flat: true
      no_log: true
      when: not ansible_check_mode

- name: Join the remaining control-plane nodes
  hosts: control_plane[1:]
  become: true
  serial: 1
  roles:
    - kubeadm_join_control_plane

- name: Join worker and storage-only nodes
  hosts: workers:ceph_nodes:!control_plane
  become: true
  roles:
    - kubeadm_join_worker
