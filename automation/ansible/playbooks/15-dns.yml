---
- name: Configure BIND primary and secondary servers
  hosts: "{{ 'dns_nodes' if 'dns_nodes' in groups else 'control_plane' }}"
  become: true
  gather_facts: true
  roles:
    - role: bind_dns
      when: dns_role is defined

- name: Configure persistent per-link resolver priority
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Build authoritative resolver address list
      ansible.builtin.set_fact:
        authoritative_dns_addresses: >-
          {{ (authoritative_dns_addresses | default([]))
             + [hostvars[item].node_ip | default(hostvars[item].ansible_host)] }}
      loop: "{{ groups[dns_server_group | default('control_plane')] }}"
      when: hostvars[item].dns_role is defined

    - name: Remove obsolete global resolver override
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d/dcn-cloud.conf
        state: absent
      notify:
        - Restart systemd-resolved after global override removal
        - Reload and apply resolver preference

    - name: Install persistent per-link DNS preference service
      ansible.builtin.copy:
        dest: /etc/systemd/system/dcn-cloud-dns.service
        mode: '0644'
        content: |
          [Unit]
          Description=Prefer DCN authoritative DNS on the management link
          Wants=network-online.target systemd-resolved.service
          After=network-online.target systemd-resolved.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/resolvectl dns {{ dns_resolver_interface | default(management_interface) }} {{ authoritative_dns_addresses | join(' ') }}
          ExecStart=/usr/bin/resolvectl domain {{ dns_resolver_interface | default(management_interface) }} ~. ~{{ dns_domain }}

          [Install]
          WantedBy=multi-user.target
      notify: Reload and apply resolver preference

  handlers:
    - name: Restart systemd-resolved after global override removal
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted

    - name: Reload and apply resolver preference
      ansible.builtin.systemd_service:
        name: dcn-cloud-dns.service
        daemon_reload: true
        enabled: true
        state: restarted
