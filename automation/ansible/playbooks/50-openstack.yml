---
- name: Reconcile the pinned OpenStack control plane
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../artifacts/admin.conf"
    SOPS_AGE_KEY_FILE: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
    REPRO_ROOT: "{{ repro_repo_path }}"
    VERIFY_AFTER_RECONCILE: "0"
    MAGNUM_CAPI_GITOPS_REPO_PATH: "{{ magnum_capi_gitops_repo_path }}"
    MAGNUM_CAPI_GITOPS_REVISION: "{{ magnum_capi_gitops_repo_ref }}"
  tasks:
    - name: Require the fetched administrative kubeconfig
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../artifacts/admin.conf"
      register: rebuild_kubeconfig

    - name: Refuse reconciliation without the fetched kubeconfig
      ansible.builtin.assert:
        that: rebuild_kubeconfig.stat.isreg | default(false)
        fail_msg: Run playbooks/20-kubernetes.yml before OpenStack reconciliation.

    - name: Verify Kubernetes API access from the Ansible control host
      ansible.builtin.command: kubectl get --raw=/readyz
      changed_when: false

    - name: Require an external SOPS age identity
      ansible.builtin.assert:
        that: lookup('env', 'SOPS_AGE_KEY_FILE') | length > 0
        fail_msg: Export SOPS_AGE_KEY_FILE from offline media.

    - name: Inspect the external SOPS age identity
      ansible.builtin.stat:
        path: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
      register: rebuild_sops_identity

    - name: Require a readable SOPS age identity
      ansible.builtin.assert:
        that:
          - rebuild_sops_identity.stat.isreg | default(false)
          - rebuild_sops_identity.stat.readable | default(false)
        fail_msg: SOPS_AGE_KEY_FILE must identify a readable regular file.

    - name: Verify immutable rebuild inputs
      ansible.builtin.command: "{{ repro_repo_path }}/automation/bin/verify-inputs.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: false

    - name: Reconcile pinned OpenStack-Helm releases
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/reconcile-full-stack.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      register: openstack_reconcile
      changed_when: true

    - name: Protect public and hidden Amphora Glance images from deletion
      ansible.builtin.command: >-
        {{ repro_repo_path }}/deploy/scripts/reconcile-glance-image-protection.sh apply
      args:
        chdir: "{{ repro_repo_path }}"
      register: glance_image_protection
      changed_when: "'changed=true' in glance_image_protection.stdout"

    - name: Reconcile the declared Glance image catalogue
      ansible.builtin.command: >-
        {{ repro_repo_path }}/deploy/scripts/reconcile-glance-image-catalog.sh apply
      args:
        chdir: "{{ repro_repo_path }}"
      register: glance_image_catalog
      changed_when: "'\"changed\": 0' not in glance_image_catalog.stdout"

    - name: Install the retained Glance image data snapshot schedule
      ansible.builtin.command: >-
        kubectl apply -f {{ repro_repo_path }}/deploy/manifests/glance-image-backup.yaml
      changed_when: true

    - name: Install Designate and PowerDNS
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/install-designate.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: true

    - name: Install CAPI, CAPO, and ORC management providers
      ansible.builtin.command: >-
        {{ repro_repo_path }}/prerequisites/cluster-api/management-cluster/scripts/install.sh
      changed_when: true

    - name: Install the CAPI add-on provider
      ansible.builtin.command: >-
        {{ repro_repo_path }}/prerequisites/cluster-api/addon-provider/scripts/install.sh
      changed_when: true

    - name: Install the Magnum workload chart repository
      ansible.builtin.command: >-
        {{ repro_repo_path }}/prerequisites/cluster-api/workload-chart-repository/scripts/install.sh
      changed_when: true

    - name: Install Magnum with CAPI integration
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/install-magnum.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: true

    - name: Reconcile Magnum CAPI GitOps platform
      ansible.builtin.command: >-
        {{ repro_repo_path }}/deploy/scripts/install-magnum-capi-gitops.sh
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: true

    - name: Reconcile federated IAM personas and scoped role assignments
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/reconcile-iam-dcn.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      when: enable_federated_iam | default(false) | bool
      changed_when: true
