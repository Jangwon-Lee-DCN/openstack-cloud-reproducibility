---
- name: Run cluster and OpenStack acceptance checks
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../artifacts/admin.conf"
  pre_tasks:
    - name: Require the fetched administrative kubeconfig
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../artifacts/admin.conf"
      register: rebuild_kubeconfig

    - name: Refuse acceptance checks without the fetched kubeconfig
      ansible.builtin.assert:
        that: rebuild_kubeconfig.stat.isreg | default(false)
        fail_msg: Run playbooks/20-kubernetes.yml before acceptance checks.

    - name: Verify Kubernetes API access from the Ansible control host
      ansible.builtin.command: kubectl get --raw=/readyz
      changed_when: false
  tasks:
    - name: Check Kubernetes nodes
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=10m
      changed_when: false
    - name: Verify the pinned OpenStack deployment
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/verify-full-stack.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: false
    - name: Verify native OpenStack and VPC IAM persona boundaries
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/verify-iam-dcn-personas.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      when: enable_federated_iam | default(false) | bool
      changed_when: false
    - name: Verify Keycloak HA and public OIDC discovery
      ansible.builtin.command: >-
        {{ services_repo_path }}/deployment/prerequisites/identity/keycloak/scripts/verify.sh
      when: enable_federated_iam | default(false) | bool
      changed_when: false
    - name: Verify VPC and OPA policy-plane enforcement
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/scripts/verify-vpc-policy-plane.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      when: enable_federated_iam | default(false) | bool
      changed_when: false
    - name: Verify mandatory observability, dashboards, logs, and traces
      ansible.builtin.command: "{{ repro_repo_path }}/deploy/monitoring/scripts/verify.sh"
      args:
        chdir: "{{ repro_repo_path }}"
      changed_when: false
