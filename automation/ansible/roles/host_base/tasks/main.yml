---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Disable persistent swap entries
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# disabled-for-kubernetes \1'

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - jq
      - lvm2
      - nfs-common
      - open-iscsi
      - python3-yaml
      - socat
    state: present
    update_cache: true

- name: Make the Kubernetes API bootstrap name resolvable before BIND exists
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "\\s{{ kubernetes_api_fqdn | regex_escape }}(?:\\s|$)"
    line: "{{ kubernetes_api_vip }} {{ kubernetes_api_fqdn }}"
    state: present

- name: Load Kubernetes and OpenStack kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/dcn-cloud.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter
      nf_conntrack
      openvswitch

- name: Load required kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter, nf_conntrack]
  changed_when: false

- name: Configure Kubernetes and OpenStack sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-dcn-cloud.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 1048576
  notify: Reload sysctl

- name: Reconcile live Kubernetes and OpenStack sysctls
  ansible.builtin.command: sysctl --system
  changed_when: false
  when: not ansible_check_mode

- name: Enable time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Enable iSCSI for Cinder attachment
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started
