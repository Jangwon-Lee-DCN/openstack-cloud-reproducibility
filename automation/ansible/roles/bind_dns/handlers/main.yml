---
- name: Validate BIND configuration
  ansible.builtin.command: named-checkconf
  listen: Validate and reload BIND
  changed_when: false

- name: Validate primary forward zone
  ansible.builtin.command: "named-checkzone {{ dns_domain }} /etc/bind/zones/db.{{ dns_domain }}"
  when: dns_role == 'primary'
  listen: Validate and reload BIND
  changed_when: false

- name: Validate primary reverse zone
  ansible.builtin.command: "named-checkzone {{ dns_reverse_zone }} /etc/bind/zones/db.{{ dns_reverse_zone }}"
  when: dns_role == 'primary'
  listen: Validate and reload BIND
  changed_when: false

- name: Reload BIND
  ansible.builtin.systemd_service:
    name: named
    state: reloaded
  listen: Validate and reload BIND

- name: Validate and reload rack-aware BIND
  ansible.builtin.shell: |
    set -euo pipefail
    named-checkconf
    {% if dns_role == 'primary' %}
    named-checkzone {{ dns_domain }} /etc/bind/zones/db.{{ dns_domain }}
    {% for reverse in dns_reverse_zones %}
    named-checkzone {{ reverse.zone }} /etc/bind/zones/db.{{ reverse.zone }}
    {% endfor %}
    {% endif %}
    systemctl reload named
  args:
    executable: /bin/bash
  changed_when: true
  listen: Validate and reload rack-aware BIND
