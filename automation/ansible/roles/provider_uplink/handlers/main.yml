---
- name: Generate Netplan configuration
  ansible.builtin.command: netplan generate
  listen: Validate and apply provider Netplan
  changed_when: false

- name: Apply provider Netplan
  ansible.builtin.command: netplan apply
  listen: Validate and apply provider Netplan
  changed_when: true

- name: Verify management default route remains
  ansible.builtin.command: "ip route show default dev {{ management_interface }}"
  listen: Validate and apply provider Netplan
  changed_when: false
