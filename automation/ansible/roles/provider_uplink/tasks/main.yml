---
- name: Read provider-interface addresses
  ansible.builtin.command: "ip -4 -o address show dev {{ provider_interface }} scope global"
  register: provider_addresses
  changed_when: false
  check_mode: false

- name: Require the provider interface to have no Layer 3 address
  ansible.builtin.assert:
    that:
      - provider_addresses.stdout | trim | length == 0
    fail_msg: >-
      The provider interface has an IP address. Move management and default
      routing to the management interface before approving this phase.

- name: Check that the provider interface owns no route
  ansible.builtin.command: "ip -json route show dev {{ provider_interface }}"
  register: provider_routes
  changed_when: false
  check_mode: false

- name: Require an empty provider routing table
  ansible.builtin.assert:
    that: provider_routes.stdout | from_json | length == 0
    fail_msg: Remove Layer 3 routes from the provider interface before continuing.

- name: Accept an externally rendered Layer 2 provider interface
  ansible.builtin.assert:
    that: confirm_provider_bridge_change | bool
    fail_msg: >-
      Review the externally rendered provider VLAN and set
      confirm_provider_bridge_change=true before acceptance.
  when: provider_interface_preconfigured | default(false) | bool

- name: Render the provider-link Netplan candidate
  ansible.builtin.template:
    src: 60-dcn-provider-uplink.yaml.j2
    dest: /etc/netplan/60-dcn-provider-uplink.yaml.candidate
    owner: root
    group: root
    mode: '0600'
  when: not (provider_interface_preconfigured | default(false) | bool)

- name: Install the approved provider-link Netplan
  ansible.builtin.copy:
    src: /etc/netplan/60-dcn-provider-uplink.yaml.candidate
    remote_src: true
    dest: /etc/netplan/60-dcn-provider-uplink.yaml
    owner: root
    group: root
    mode: '0600'
  when:
    - confirm_provider_bridge_change | bool
    - not (provider_interface_preconfigured | default(false) | bool)
  notify: Validate and apply provider Netplan

- name: Explain an unapproved provider-link candidate
  ansible.builtin.debug:
    msg: >-
      Candidate rendered only. Review it with console access, then set
      confirm_provider_bridge_change=true to install it. OpenStack-Helm OVS
      later creates br-ex and attaches this Layer 2-only interface.
  when:
    - not confirm_provider_bridge_change | bool
    - not (provider_interface_preconfigured | default(false) | bool)
