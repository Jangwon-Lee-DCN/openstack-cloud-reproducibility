---
- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes repository key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: '0644'

- name: Configure Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /"
    filename: kubernetes
    state: present

- name: Detect an existing Kubernetes repository during dry-run
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/kubernetes.list
  register: kubernetes_repository_file
  check_mode: false

- name: Download CRI-O repository key
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/cri-o.asc
    mode: '0644'
  when: container_runtime | default('crio') == 'crio'

- name: Configure CRI-O repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cri-o.asc] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_minor }}/deb/ /"
    filename: cri-o
    state: present
  when: container_runtime | default('crio') == 'crio'

- name: Require a supported container runtime
  ansible.builtin.assert:
    that: container_runtime | default('crio') in ['containerd', 'crio']

- name: Remove CRI-O when containerd is selected
  ansible.builtin.apt:
    name: cri-o
    state: absent
  when: container_runtime | default('crio') == 'containerd'

- name: Install Kubernetes packages and the selected runtime
  ansible.builtin.apt:
    name: >-
      {{ [
           'kubelet=' ~ kubernetes_deb_version,
           'kubeadm=' ~ kubernetes_deb_version,
           'kubectl=' ~ kubernetes_deb_version
         ] + (['containerd'] if (container_runtime | default('crio')) == 'containerd' else ['cri-o']) }}
    state: present
    update_cache: true
    allow_downgrade: false
  when: not ansible_check_mode or kubernetes_repository_file.stat.exists

- name: Report deferred first-run package validation in dry-run
  ansible.builtin.debug:
    msg: >-
      The Kubernetes repository is not present yet. A real run will install the
      pinned Kubernetes packages and {{ container_runtime | default('crio') }};
      rerun with --check afterward to validate package idempotency.
  when:
    - ansible_check_mode
    - not kubernetes_repository_file.stat.exists

- name: Configure containerd with the systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    content: |
      version = 2

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
  when: container_runtime | default('crio') == 'containerd'
    and (not ansible_check_mode or kubernetes_repository_file.stat.exists)
  notify: Restart containerd

- name: Prevent implicit Kubernetes and runtime package upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: >-
    {{ ['kubelet', 'kubeadm', 'kubectl']
       + (['containerd'] if (container_runtime | default('crio')) == 'containerd' else ['cri-o']) }}
  when: not ansible_check_mode or kubernetes_repository_file.stat.exists

- name: Enable the selected runtime and kubelet
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: >-
    {{ [('containerd' if (container_runtime | default('crio')) == 'containerd' else 'crio'), 'kubelet'] }}
  when: not ansible_check_mode or kubernetes_repository_file.stat.exists

- name: Download pinned Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/var/cache/helm-{{ helm_version }}-linux-amd64.tar.gz"
    mode: '0644'

- name: Detect an existing Helm archive during dry-run
  ansible.builtin.stat:
    path: "/var/cache/helm-{{ helm_version }}-linux-amd64.tar.gz"
  register: helm_archive_file
  check_mode: false

- name: Extract pinned Helm binary
  ansible.builtin.unarchive:
    src: "/var/cache/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [linux-amd64/helm]
    extra_opts: [--strip-components=1]
    creates: /usr/local/bin/helm
  when: not ansible_check_mode or helm_archive_file.stat.exists

- name: Report deferred first-run Helm validation in dry-run
  ansible.builtin.debug:
    msg: >-
      The pinned Helm archive is not cached yet. A real run will download and
      install {{ helm_version }}; rerun with --check afterward to validate it.
  when:
    - ansible_check_mode
    - not helm_archive_file.stat.exists
