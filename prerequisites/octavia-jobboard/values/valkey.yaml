fullnameOverride: valkey

architecture: replication

auth:
  enabled: true
  # Octavia 2026.1/Taskflow intentionally does not send the data-store
  # credential to Sentinel. The promoted Valkey primary remains authenticated.
  sentinel: false
  existingSecret: octavia-valkey-auth
  existingSecretPasswordKey: password
  usePasswordFiles: true
  usePasswordFileFromSecret: true

image:
  registry: registry-1.docker.io
  repository: bitnami/valkey
  tag: latest
  digest: sha256:5d43ca8bb57aa263ef78d1684dbf1e4b4f63844727eafdd5ea2b0e102a25b141

commonConfiguration: |-
  appendonly yes
  appendfsync everysec
  save ""

primary:
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: rook-ceph-block
    size: 2Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Retain
    whenDeleted: Retain
  pdb:
    create: true
    minAvailable: 1

replica:
  replicaCount: 3
  nodeSelector:
    openstack-control-plane: enabled
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  podAntiAffinityPreset: soft
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: octavia-valkey
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: rook-ceph-block
    size: 2Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Retain
    whenDeleted: Retain
  pdb:
    create: true
    minAvailable: 1

sentinel:
  enabled: true
  primarySet: octavia-jobboard
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 60000
  parallelSyncs: 1
  image:
    registry: registry-1.docker.io
    repository: bitnami/valkey-sentinel
    tag: latest
    digest: sha256:85f00718bf8bd8d2510dcbd4ba4e87e34519461a595054b8ae8f6c96b3ddc31f
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

networkPolicy:
  enabled: false

metrics:
  enabled: false
