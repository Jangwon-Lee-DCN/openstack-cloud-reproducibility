apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
  - name: registry.k8s.io/capi-openstack/capi-openstack-controller
    newName: registry.dcn.ssu.ac.kr/openstack/capo-controller
    digest: sha256:91bfcbad65adfacd832ec6935011eee76790ac71b27e9d333d125a7d519f4cf8
resources:
  - ../../vendor/capi-core-v1.13.4.yaml
  - ../../vendor/capi-bootstrap-kubeadm-v1.13.4.yaml
  - ../../vendor/capi-control-plane-kubeadm-v1.13.4.yaml
  - ../../vendor/capo-v0.14.6.yaml
  - ../../vendor/orc-v2.5.0.yaml
  - pdb.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ".*controller-manager"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: control-plane
                      operator: Exists
                topologyKey: kubernetes.io/hostname
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: capo-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry-pull

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: orc-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
