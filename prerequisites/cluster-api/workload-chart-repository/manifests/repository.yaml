apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnum-chart-repository
  namespace: openstack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: magnum-chart-repository
  template:
    metadata:
      labels:
        app: magnum-chart-repository
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: magnum-chart-repository
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.29.1-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: repository
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.yaml
              port: http
          livenessProbe:
            httpGet:
              path: /index.yaml
              port: http
      volumes:
        - name: repository
          configMap:
            name: magnum-workload-chart-repository
        - name: config
          configMap:
            name: magnum-workload-chart-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: magnum-workload-chart-nginx
  namespace: openstack
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      location / {
        try_files $uri =404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: magnum-chart-repository
  namespace: openstack
spec:
  selector:
    app: magnum-chart-repository
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: magnum-chart-repository
  namespace: openstack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: magnum-chart-repository
