apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openstack-internal-services
  namespace: openstack
spec:
  parentRefs:
    - name: openstack-internal-gateway
      namespace: openstack-internal-gateway-system
      sectionName: https
  hostnames:
    - internal.cloud.dcn.ssu.ac.kr
  rules:
    # python-novaclient still constructs a generic keystoneauth Token plugin
    # when Horizon supplies both auth_token and endpoint_override.  Generic
    # discovery deliberately normalizes a versioned, path-prefixed auth URL
    # such as /identity/v3 to the origin-root /v3/auth/tokens.  Keep the
    # documented /identity endpoint, but also expose Keystone's native root
    # version path so project-token re-scoping works for Horizon and other
    # legacy/generic clients.  Without this alias direct service requests
    # work, while Nova list/create screens fail with a misleading 404 that
    # Horizon presents as an authorization error.
    - matches: [{path: {type: PathPrefix, value: /v3}}]
      backendRefs: [{name: keystone-api, port: 5000}]
    # python-novaclient's version discovery passes its absolute endpoint back
    # through keystoneauth's Adapter. With a /compute prefix the Adapter
    # normalizes that probe to origin-root /v2.1, even though ordinary
    # /servers and /limits calls retain /compute/v2.1. Serve the native Nova
    # path so microversion discovery cannot fail before instance operations.
    - matches: [{path: {type: PathPrefix, value: /v2.1}}]
      backendRefs: [{name: nova-api, port: 8774}]
    - matches: [{path: {type: PathPrefix, value: /identity}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: keystone-api, port: 5000}]
    - matches: [{path: {type: PathPrefix, value: /compute}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: nova-api, port: 8774}]
    - matches: [{path: {type: PathPrefix, value: /network}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: neutron-server, port: 9696}]
    - matches: [{path: {type: PathPrefix, value: /image}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: glance-api, port: 9292}]
    - matches: [{path: {type: PathPrefix, value: /volume}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: cinder-api, port: 8776}]
    - matches: [{path: {type: PathPrefix, value: /orchestration}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: heat-api, port: 8004}]
    - matches: [{path: {type: PathPrefix, value: /load-balancer}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: octavia-api, port: 9876}]
    - matches: [{path: {type: PathPrefix, value: /key-manager}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: barbican-api, port: 9311}]
    - matches: [{path: {type: PathPrefix, value: /container-infra}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: magnum-api, port: 9511}]
    - matches: [{path: {type: PathPrefix, value: /baremetal}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: ironic-api, port: 6385}]
