apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-vm-internal-catalog
  namespace: openstack
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    REGION=RegionOne-VM
    BASE=https://api.internal.cloud.dcn.ssu.ac.kr

    openstack region show "${REGION}" >/dev/null 2>&1 ||
      openstack region create --parent-region RegionOne \
        --description "VM-routable OpenStack API endpoints" "${REGION}"

    ensure_endpoint() {
      service_type="$1"
      url="$2"
      service_id="$(openstack service show "${service_type}" -f value -c id)"
      test -n "${service_id}"
      endpoint_id="$(openstack endpoint list --service "${service_id}" \
        --interface internal --region "${REGION}" -f value -c ID | head -n1)"
      if test -n "${endpoint_id}"; then
        openstack endpoint set --url "${url}" "${endpoint_id}"
      else
        openstack endpoint create --region "${REGION}" \
          "${service_id}" internal "${url}"
      fi
    }

    ensure_endpoint identity "${BASE}/identity/v3"
    ensure_endpoint compute "${BASE}/compute/v2.1"
    ensure_endpoint network "${BASE}/network"
    ensure_endpoint image "${BASE}/image"
    ensure_endpoint volumev3 "${BASE}/volume/v3/%(project_id)s"
    ensure_endpoint orchestration "${BASE}/orchestration/v1/%(project_id)s"
    ensure_endpoint load-balancer "${BASE}/load-balancer"
    ensure_endpoint key-manager "${BASE}/key-manager"

    echo "RegionOne-VM internal endpoint reconciliation completed."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openstack-vm-internal-catalog-reconcile
  namespace: openstack
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        application: openstack-vm-internal-catalog
        component: reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/catalog/reconcile.sh]
          envFrom:
            - secretRef:
                name: keystone-keystone-admin
          volumeMounts:
            - name: script
              mountPath: /opt/catalog
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: openstack-vm-internal-catalog
            defaultMode: 0555
