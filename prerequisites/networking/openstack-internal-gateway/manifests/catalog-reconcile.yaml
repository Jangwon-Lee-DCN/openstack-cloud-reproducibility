apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-vm-internal-catalog
  namespace: openstack
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    REGION=seoul-ssu-1
    openstack region show "${REGION}" >/dev/null 2>&1 ||
      openstack region create \
        --description "Seoul SSU production region" "${REGION}"
    echo "${REGION} region prerequisite reconciliation completed."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openstack-vm-internal-catalog-reconcile
  namespace: openstack
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        application: openstack-vm-internal-catalog
        component: reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/catalog/reconcile.sh]
          envFrom:
            - secretRef:
                name: keystone-keystone-admin
          volumeMounts:
            - name: script
              mountPath: /opt/catalog
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: openstack-vm-internal-catalog
            defaultMode: 0555
