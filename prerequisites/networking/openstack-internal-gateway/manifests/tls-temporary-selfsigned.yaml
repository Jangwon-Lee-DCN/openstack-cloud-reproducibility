apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openstack-internal-ca
  namespace: openstack-internal-gateway-system
spec:
  isCA: true
  commonName: openstack-internal-poc-root
  secretName: openstack-internal-ca
  issuerRef:
    name: selfsigned-temporary
    kind: ClusterIssuer
  duration: 8760h
  renewBefore: 720h
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openstack-internal-ca
  namespace: openstack-internal-gateway-system
spec:
  ca:
    secretName: openstack-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openstack-internal-tls
  namespace: openstack-internal-gateway-system
spec:
  secretName: openstack-internal-tls
  dnsNames:
    - internal.cloud.dcn.ssu.ac.kr
  issuerRef:
    name: openstack-internal-ca
    kind: Issuer
  duration: 2160h
  renewBefore: 360h
