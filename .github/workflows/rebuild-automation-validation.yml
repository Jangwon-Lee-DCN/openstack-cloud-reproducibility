---
name: Rebuild automation validation

on:
  pull_request:
    paths:
      - ".github/workflows/rebuild-automation-validation.yml"
      - "automation/**"
      - "docs/fresh-server-rebuild-*.md"
      - "docs/node-expansion-operator-guide.md"
      - "helm/packages/**"
      - "release-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-automation-validation.yml"
      - "automation/**"
      - "docs/fresh-server-rebuild-*.md"
      - "docs/node-expansion-operator-guide.md"
      - "helm/packages/**"
      - "release-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reproducibility repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned validation tools
        run: |
          python -m pip install --disable-pip-version-check \
            ansible-core==2.16.3 \
            ansible-lint==6.17.2 \
            yamllint==1.33.0 \
            PyYAML==6.0.1

      - name: Validate rebuild and expansion automation
        env:
          ALLOW_DIRTY_REBUILD_INPUTS: "0"
        run: automation/bin/verify-automation.sh
